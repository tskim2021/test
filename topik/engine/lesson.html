<!doctype html><html><head><meta charset="utf-8"><style>

.sent .a{font-size:var(--sa,52px);line-height:1.15}.sent .b{font-size:22px;margin-top:2px}.sent .c{font-size:27px;font-weight:700;color:var(--amber);margin-top:2px}
.ctx .tt{font-size:30px}.ctx .dotc{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--coral))}
</style></head><body>
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div id="grain"></div><div id="vig"></div></div>
<div id="hdr"><div class="l"><span class="dot"></span><b>TOPIK</b><span id="hdrt"></span></div><div id="prog"></div></div>
<div id="sub"></div>
<script>const Q=new URLSearchParams(location.search),LANG=Q.get("lang")||"en",LES=Q.get("lesson")||"02";document.write('<script src="../out/timeline_'+LES+'_'+LANG+'.js"><\/script>')</script>
<script>
const $=i=>document.getElementById(i),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3),back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

const sz=(len,tb)=>tb.find(([m])=>len<=m)[1];

$('hdrt').textContent=L.hdr;
const SC=TL.scenes,IT=TL.items,K=(i,k)=>IT[i+'_'+k];

const TURN=`<div class="box glass"><svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="29" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/><circle class="ring" cx="34" cy="34" r="29" fill="none" stroke="#ffc978" stroke-width="6" stroke-linecap="round" transform="rotate(-90 34 34)" stroke-dasharray="182.2" stroke-dashoffset="0"/><rect x="28" y="20" width="12" height="20" rx="6" fill="#fff"/><path d="M23 33q0 11 11 11t11-11M34 44v6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div class="tt">${L.turn}<small>${L.turn2}</small></div></div>`;
const JP=[[760,40],[900,150],[700,250],[1010,300],[840,370]];
const CK='<svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" stroke="#06241f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RING=`<svg width="96" height="96" viewBox="0 0 68 68"><circle cx="34" cy="34" r="29" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/><circle class="ring" cx="34" cy="34" r="29" fill="none" stroke="#ffc978" stroke-width="6" stroke-linecap="round" transform="rotate(-90 34 34)" stroke-dasharray="182.2" stroke-dashoffset="0"/><rect x="28" y="20" width="12" height="20" rx="6" fill="#fff"/><path d="M23 33q0 11 11 11t11-11M34 44v6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
function mkRow(list){const N=list.filter(Boolean).length,Sp=list.length-N,wg=Math.min(190,1136/(N+Sp*.45)-14),f=wg*.79;
 return `<div class="row" style="gap:12px">`+list.map(x=>x?`<div class="g" style="width:${wg}px"><div class="ch" style="font-size:${f}px">${x[0]}</div><div class="rm" style="font-size:${Math.min(25,wg*.14)}px">${x[1]}</div></div>`:`<div style="width:${wg*.35}px"></div>`).join('')+`</div>`;}
const COLS=[['#8b6cff','#c3b5ff'],['#3de0c5','#a4f3e6'],['#ff7a59','#ffb38f']];
SC.forEach((s,i)=>{const d=s.d;let h='';
 if(s.type==='intro')h=`<div class="big">${d.num}</div>`+d.decor.map((c,j)=>`<div class="jam glass" style="left:${JP[j][0]}px;top:${JP[j][1]}px">${c}</div>`).join('')+`<div class="ib"><div class="kick">TOPIK · 한국어능력시험</div><div class="mask"><div class="t1">${d.title1}</div></div><div class="mask"><div class="t2">${d.title2}</div></div><div class="t3">${d.sub}</div></div>`;
 if(s.type==='expr')h=`<div class="k"><span class="num">${d.num}</span><span class="kt">${d.kicker}</span></div>${mkRow(d.syl)}<div class="mean">${d.meaning}</div><div class="stage"><div class="vz"><canvas class="viz" width="1136" height="130"></canvas></div><div class="ctx"><div class="box glass"><span class="dotc"></span><div class="tt">${d.ctx}</div></div></div>${d.note?`<div class="note"><div class="w"><small>${L.wr}</small>${d.note.w}</div><div class="ar">→</div><div class="w"><small>${L.sd}</small>${d.note.s}</div><div class="rule">${d.note.rule}</div></div>`:''}<div class="turn">${TURN}</div></div>`;
 if(s.type==='build'){const cs=d.cards.map((c,j)=>`<div class="card glass" style="--c1:${COLS[j][0]};--c2:${COLS[j][1]}"><div class="tg">${c.tag}</div><div class="hg" style="font-size:${sz([...c.ko.replace(/ /g,'')].length,[[2,112],[3,96],[5,80],[7,62],[99,50]])}px">${c.ko}</div><div class="gl">${c.gloss}</div><div class="ro">${c.rom}</div></div>`);
  h=`<div class="k"><span class="num">${d.num}</span><span class="kt">${d.kicker}</span></div><div class="cards">${cs.map((c,j)=>c+(j<2?`<span class="plus">${d.ops[j]}</span>`:'')).join('')}</div><div class="stage"><div class="sent" style="--sa:${sz([...d.full.ko].length,[[6,64],[10,52],[99,44]])}px"><div class="a"><i>${d.full.ko}</i></div><div class="b">${d.full.rom}</div><div class="c">${d.full.loc}</div></div><div class="turn">${TURN}</div></div>`;}
 if(s.type==='quiz')h=`<div class="k"><span class="num">${d.num}</span><span class="kt">${L.kq}</span></div><div class="qcard glass"><div class="ql">${d.ql}</div><div class="qm" style="font-size:${sz([...d.prompt].length,[[6,88],[12,70],[20,54],[99,44]])}px">${d.prompt}</div><div class="qd"></div><div class="qa"><div class="qr">${RING}</div><div class="qans" style="font-size:${sz([...d.ans].length,[[5,100],[9,80],[14,64],[99,52]])}px"><b>${d.ans}</b><small>${d.rom}</small></div></div></div>`;
 if(s.type==='outro')h=`<div class="k"><span class="num">✓</span><span class="kt">${L.ko_}</span></div>`+d.recap.map((r,j)=>`<div class="rc glass" style="left:${j*387}px"><div class="ck">${CK}</div><div class="hg" style="font-size:${sz([...r.ko].length,[[6,52],[9,44],[12,38],[99,32]])}px">${r.ko}</div><div class="gl">${r.gloss}</div><div class="ro">${r.rom}</div></div>`).join('')+`<div class="next"><div class="box glass"><small>${d.next.nl}</small><span>${d.next.text}</span> <span style="color:var(--amber)">→</span></div></div>`;
 const e=document.createElement('section');e.className='sc';e.id='s'+i;e.innerHTML=h;document.body.insertBefore(e,$('sub'));});
const sceneOf=t=>{const i=SC.findIndex(s=>t>=s.t0&&t<s.t1);return i<0?SC.length-1:i};
function sweep(els,a0,a1,t,rowIn){const n=els.length;els.forEach((e,i)=>{const p=t<a0?0:t>a1?1:clamp((t-a0)/(a1-a0)*n-i),act=p>0&&p<1;
 e.firstChild.style.setProperty('--p',p*100+'%');e.className='g'+(act?' act':p>=1?' done':'');const k=ease((rowIn-i*.07)/.55);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*30-(act?10:0)}px) scale(${act?1.04:1})`;});}
function drawViz(cv,t){const c=cv.getContext('2d'),W=1136,H=130,b=TL.bands[Math.min(TL.bands.length-1,Math.round(t*30))],n=b.length;c.clearRect(0,0,W,H);
 const g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#8b6cff');g.addColorStop(.5,'#ff7a59');g.addColorStop(1,'#ffc978');c.fillStyle=g;const st=W/n,bw=st*.52;
 for(let k=0;k<n;k++){const v=Math.pow(b[k]/100,.9),h=6+v*(H-14);c.globalAlpha=.45+.55*v;c.beginPath();c.roundRect(k*st+(st-bw)/2,(H-h)/2,bw,h,bw/2);c.fill();}c.globalAlpha=1;}
const ring=(el,t,a,b)=>el.querySelector('.ring').setAttribute('stroke-dashoffset',182.2*clamp((t-a)/(b-a)));
window.render=function(t){
 const si=sceneOf(t),s=SC[si],d=s.d,l=t-s.t0,dd=s.t1-s.t0,sec=$('s'+si),q=x=>sec.querySelector(x);
 SC.forEach((x,i)=>{const e=$('s'+i);if(i!==si){e.style.display='none';return}e.style.display='block';e.style.opacity=Math.min(ease(l/.45),clamp((dd-l)/.4));e.style.transform=`translateY(${(1-ease(l/.7))*22}px)`;});
 document.querySelectorAll('#prog b').forEach((b,i)=>b.style.width=(si>i?100:si===i?clamp(l/dd)*100:0)+'%');
 $('b1').style.transform=`translate(${Math.sin(t/5)*50+si*40}px,${Math.cos(t/6)*40}px)`;$('b2').style.transform=`translate(${Math.cos(t/5)*50-si*30}px,${Math.sin(t/7)*40}px)`;$('b3').style.transform=`translate(${Math.sin(t/4)*60}px,${Math.cos(t/5)*30}px)`;
 if(s.type==='intro'){const r=l,m=sec.querySelectorAll('.mask>div');q('.kick').style.opacity=ease((r-.1)/.5);m[0].style.transform=`translateY(${(1-ease((r-.2)/.9))*115}%)`;m[1].style.transform=`translateY(${(1-ease((r-.55)/.8))*115}%)`;q('.t3').style.opacity=ease((r-1.2)/.6);
  q('.big').style.opacity=ease(r/1.2);q('.big').style.transform=`translateX(${(1-ease(r/1.4))*80+Math.sin(t/3)*8}px)`;sec.querySelectorAll('.jam').forEach((e,i)=>{const k=back((r-.3-i*.12)/.6);e.style.opacity=clamp(k);e.style.transform=`translateY(${Math.sin(t*1.3+i*1.7)*12}px) scale(${.6+.4*k})`;});}
 if(s.type==='expr'){const a=K(si,'a'),b=K(si,'b'),c=K(si,'c'),dk=K(si,'d'),r=K(si,'r'),g=K(si,'g');
