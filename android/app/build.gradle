plugins {
    id 'com.android.application'
}

android {
    namespace 'com.depositmonitor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.depositmonitor'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '2.2'
        // 내부 배포용: 빌드할 때 -PpresetUrl=… -PpresetToken=… 을 주면 처음 설치 시 서버 주소·토큰이 미리 들어간다(저장소에는 넣지 않는다).
        buildConfigField 'String', 'PRESET_URL', '"' + (project.findProperty('presetUrl') ?: '') + '"'
        buildConfigField 'String', 'PRESET_TOKEN', '"' + (project.findProperty('presetToken') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
