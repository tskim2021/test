name: Deploy map to GitHub Pages

on:
  push:
    branches: [main, claude/eager-mccarthy-07shah]
    paths: ['osm-map/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only files the page needs
        run: |
          mkdir _site
          cp osm-map/index.html osm-map/vets_data.js osm-map/repair_data.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
