<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 입금 내역</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#6b7480; --accent:#1f9d55; --line:#e6e8ec; --chip:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f26; --text:#e8eaed; --muted:#8b949e; --accent:#3ddc84; --line:#2a2f38; --chip:#262b34; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .status { font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c0392b; margin-right:6px; }
  .dot.on { background:var(--accent); }
  .summary { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .label { font-size:13px; color:var(--muted); }
  .card .value { font-size:22px; font-weight:700; margin-top:2px; }
  .filters { margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--chip); color:var(--text); border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .row .sep { color:var(--muted); }
  input, select { font:inherit; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=search] { flex:1; min-width:140px; }
  .list { padding:0; overflow:hidden; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li.new { animation:flash 2.5s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 25%, transparent); } to { background:transparent; } }
  .who { font-weight:600; } .when { font-size:13px; color:var(--muted); }
  .amt { color:var(--accent); font-weight:700; font-size:18px; }
  .empty { padding:32px; text-align:center; color:var(--muted); }
  .pager { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:16px; font-size:14px; color:var(--muted); }
  .pager button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .right { display:flex; align-items:center; gap:12px; }
  .btn { border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .amtcol { min-width:104px; text-align:right; }
  .slot { width:84px; display:flex; justify-content:flex-end; }
  .slot .btn { width:100%; }
  @media (max-width:560px) {
    li { flex-wrap:wrap; row-gap:6px; }
    li .right { width:100%; justify-content:flex-end; }
  }
  .btn.primary { background:var(--accent); color:#fff; font-weight:600; }
  li.m-full { background:color-mix(in srgb, var(--accent) 13%, transparent); }
  li.m-name { background:color-mix(in srgb, #e6a100 17%, transparent); }
  li.m-amount { background:color-mix(in srgb, #2d7ff9 14%, transparent); }
  li.m-other { background:color-mix(in srgb, #8b949e 18%, transparent); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin:-6px 0 12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .sec { font-size:13px; font-weight:700; margin:16px 0 0; }
  .diff { font-size:12px; color:#c0392b; margin:0 0 6px; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  li.done { background:color-mix(in srgb, var(--accent) 26%, transparent); }
  .lhs { display:flex; align-items:center; gap:12px; min-width:0; }
  .lhs { flex:1 1 0; }
  .lhs input[type=checkbox], .toolbar input[type=checkbox] { width:18px; height:18px; flex:none; accent-color:var(--accent); }
  .toolbar { justify-content:space-between; }
  .toolbar label { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .btn.danger { border-color:#c0392b; color:#c0392b; }
  .btn:disabled { opacity:.4; cursor:default; }
  .badge { font-size:12px; color:var(--muted); background:var(--chip); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  /* 오른쪽에서 밀려 나오는 상세 패널 */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; opacity:0; pointer-events:none; transition:opacity .2s; }
  #modal.open { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--card); padding:18px; overflow:auto;
           border-radius:14px 0 0 14px; box-shadow:-8px 0 24px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .25s ease; }
  #modal.open .sheet { transform:none; }
  .ordinfo { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4; overflow-wrap:anywhere; }
  .sheet h2 { font-size:17px; margin:0 0 4px; }
  .sheet .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .order { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; }
  .order .head { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .order .meta { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .item { display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3px 0; border-top:1px dashed var(--line); }
  .item .opt { color:var(--muted); font-size:12px; }
  .sheet .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .err { color:#c0392b; font-size:13px; margin-top:8px; }
  #login { max-width:320px; margin:20vh auto; text-align:center; }
  #login input, #login button { width:100%; padding:12px; margin-top:10px; font-size:16px; border-radius:8px; border:1px solid var(--line); }
  #login button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>입금 모니터</h1>
  <input id="tokenInput" type="password" placeholder="접속 토큰" autocomplete="current-password">
  <button id="loginBtn">접속</button>
</div>
<main id="app" hidden>
  <header>
    <h1>실시간 입금 내역</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  </header>

  <div class="summary">
    <div class="card"><div class="label" id="sumLabel">입금 합계</div><div class="value" id="sumTotal">0원</div></div>
    <div class="card"><div class="label">입금 건수</div><div class="value" id="sumCount">0건</div></div>
  </div>

  <div class="card filters">
    <div class="chips" id="chips">
      <button class="chip" data-range="today">오늘</button>
      <button class="chip" data-range="yesterday">어제</button>
      <button class="chip" data-range="thisWeek">이번주</button>
      <button class="chip" data-range="lastWeek">저번주</button>
      <button class="chip" data-range="all">전체</button>
    </div>
    <div class="row toolbar">
      <label><input type="checkbox" id="selAll"> 전체 선택</label>
      <span><span id="selCount" class="status"></span> <button class="btn danger" id="hideBtn" disabled>선택 삭제</button></span>
    </div>
    <div class="row">
      <input type="date" id="from" aria-label="시작일자">
      <span class="sep">~</span>
      <input type="date" id="to" aria-label="종료일자">
      <select id="limit" aria-label="보기 개수">
        <option value="10">10개씩</option>
        <option value="20" selected>20개씩</option>
        <option value="50">50개씩</option>
        <option value="100">100개씩</option>
      </select>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="입금자 검색" aria-label="입금자 검색">
    </div>
  </div>

  <div class="legend" id="legend" hidden>
    <span><i style="background:color-mix(in srgb,var(--accent) 45%,transparent)"></i>이름·금액 일치</span>
    <span><i style="background:color-mix(in srgb,#e6a100 55%,transparent)"></i>이름만 일치</span>
    <span><i style="background:color-mix(in srgb,#2d7ff9 50%,transparent)"></i>금액만 일치</span>
    <span><i style="background:color-mix(in srgb,#8b949e 55%,transparent)"></i>다른 상태 주문</span>
    <span><i style="background:color-mix(in srgb,var(--accent) 80%,transparent)"></i>처리 완료</span>
  </div>
  <div class="card list"><ul id="list"></ul></div>
  <div class="pager">
    <button id="prev">이전</button>
    <span id="pageInfo">1 / 1</span>
    <button id="next">다음</button>
  </div>
</main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
let token = localStorage.getItem('viewToken') || '';
const state = { from: '', to: '', q: '', limit: 20, page: 1, range: 'today' };
let es, highlightId = null, reqSeq = 0, shopEnabled = false;
const selected = new Set();
const LEVEL_LABEL = { full: '이름·금액 일치', name: '이름만 일치', amount: '금액만 일치', other: '다른 상태 주문' };
let adminToken = localStorage.getItem('adminToken') || '';

// ---- 날짜 계산 (한국시간 기준 'YYYY-MM-DD') ----
const DAY = 86400000;
const kstNow = () => new Date(Date.now() + 9 * 3600000);
const ymd = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => ymd(new Date(Date.parse(s + 'T00:00:00Z') + n * DAY));
const weekStart = (s) => { const dow = new Date(s + 'T00:00:00Z').getUTCDay(); return addDays(s, -((dow + 6) % 7)); }; // 월요일 시작
function rangeDates(name) {
  const today = ymd(kstNow());
  switch (name) {
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case 'thisWeek': { const s = weekStart(today); return [s, addDays(s, 6)]; }
    case 'lastWeek': { const s = addDays(weekStart(today), -7); return [s, addDays(s, 6)]; }
    default: return ['', ''];
  }
}
const RANGE_LABEL = { today: '오늘', yesterday: '어제', thisWeek: '이번주', lastWeek: '저번주', all: '전체' };

function fmtTime(iso) {
  return new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function renderRow(d) {
  const li = document.createElement('li');
  li.className = [d.id === highlightId ? 'new' : '', d.order_id ? 'done' : d.match_level ? 'm-' + d.match_level : ''].filter(Boolean).join(' ');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(d.id); cb.dataset.id = d.id;
  cb.onchange = () => { cb.checked ? selected.add(d.id) : selected.delete(d.id); updateToolbar(); };
  const lhs = document.createElement('div'); lhs.className = 'lhs';
  const left = document.createElement('div');
  const who = document.createElement('div'); who.className = 'who'; who.textContent = d.sender || '(입금자 미확인)';
  const when = document.createElement('div'); when.className = 'when'; when.textContent = fmtTime(d.received_at);
  left.append(who, when);
  if (d.order_id) {
    const info = document.createElement('div'); info.className = 'ordinfo';
    const items = (d.order_items || []).map((i) => `${i.name}${i.option ? ` (${i.option})` : ''} ×${i.qty}`).join(' / ');
    info.textContent = `주문 ${d.order_id}${items ? ' · ' + items : ''}`;
    left.append(info);
  }
  const amt = document.createElement('div'); amt.className = 'amt'; amt.textContent = '+' + won(d.amount);
  const right = document.createElement('div'); right.className = 'right';
  // 오른쪽 끝부터 [뱃지] [금액(고정 너비)] [버튼 칸(고정 너비)] 순서로 정렬해 모든 행의 위치를 맞춘다.
  if (d.order_id) {
    const b = document.createElement('span'); b.className = 'badge'; b.textContent = '주문완료 #' + d.order_id; right.append(b);
  } else if (shopEnabled && d.match_level) {
    const m = document.createElement('span'); m.className = 'badge'; m.textContent = LEVEL_LABEL[d.match_level]; right.append(m);
  }
  amt.classList.add('amtcol');
  const slot = document.createElement('div'); slot.className = 'slot';
  if (shopEnabled && !d.order_id) {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = '주문 확인'; b.onclick = () => openMatch(d); slot.append(b);
  }
  right.append(amt);
  if (shopEnabled) right.append(slot);
  lhs.append(cb, left);
  li.append(lhs, right);
  return li;
}
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.1;
    o.start(); o.stop(c.currentTime + 0.2);
  } catch {}
}

// ---- 조회 ----
function syncControls() {
  $('from').value = state.from; $('to').value = state.to;
  $('limit').value = String(state.limit); $('q').value = state.q;
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c.dataset.range === state.range));
}
function sumLabel() {
  const base = state.range ? RANGE_LABEL[state.range] : (state.from || state.to ? `${state.from || '처음'} ~ ${state.to || '현재'}` : '전체');
  return base + (state.q ? ` · "${state.q}"` : '') + ' 입금 합계';
}
async function load() {
  const seq = ++reqSeq;
  const p = new URLSearchParams({ limit: state.limit, page: state.page });
  if (state.from) p.set('from', state.from);
  if (state.to) p.set('to', state.to);
  if (state.q) p.set('q', state.q);
  const r = await fetch('/api/deposits?' + p, { headers: { authorization: 'Bearer ' + token } });
  if (r.status === 401) { localStorage.removeItem('viewToken'); return showLogin(); }
  if (!r.ok || seq !== reqSeq) return;
  const data = await r.json();
  shopEnabled = !!data.shop;
  $('legend').hidden = !shopEnabled;
  $('login').hidden = true; $('app').hidden = false;
  state.page = Math.min(data.page, data.pages);
  $('sumLabel').textContent = sumLabel();
  $('sumTotal').textContent = won(data.total);
  $('sumCount').textContent = data.count + '건';
  selected.clear(); updateToolbar();
  const list = $('list'); list.replaceChildren();
  if (!data.deposits.length) list.innerHTML = '<div class="empty">조건에 맞는 입금 내역이 없습니다</div>';
  data.deposits.forEach((d) => list.append(renderRow(d)));
  $('pageInfo').textContent = `${data.page} / ${data.pages}`;
  $('prev').disabled = data.page <= 1;
  $('next').disabled = data.page >= data.pages;
  highlightId = null;
  syncControls();
  if (!es) connect();
}
function setRange(name) {
  const [f, t] = rangeDates(name);
  Object.assign(state, { range: name, from: f, to: t, page: 1 });
  load();
}
function connect() {
  es = new EventSource('/events?token=' + encodeURIComponent(token));
  es.onopen = () => { $('dot').classList.add('on'); $('statusText').textContent = '실시간 연결됨'; };
  es.onerror = () => { $('dot').classList.remove('on'); $('statusText').textContent = '재연결 중…'; };
  es.addEventListener('deposit', (e) => {
    highlightId = JSON.parse(e.data).id;
    beep();
    // '오늘/이번주'처럼 이름 있는 기간은 날짜가 바뀌었을 수 있어 다시 계산한다.
    if (state.range) { const [f, t] = rangeDates(state.range); state.from = f; state.to = t; }
    state.page = 1;
    load();
  });
}

// ---- 선택 삭제(숨김) ----
function updateToolbar() {
  const boxes = [...document.querySelectorAll('#list input[type=checkbox]')];
  $('selCount').textContent = selected.size ? `${selected.size}건 선택` : '';
  $('hideBtn').disabled = !selected.size;
  $('selAll').checked = boxes.length > 0 && boxes.every((b) => b.checked);
}
$('selAll').onchange = () => {
  document.querySelectorAll('#list input[type=checkbox]').forEach((b) => {
    b.checked = $('selAll').checked;
    $('selAll').checked ? selected.add(Number(b.dataset.id)) : selected.delete(Number(b.dataset.id));
  });
  updateToolbar();
};
$('hideBtn').onclick = async () => {
  if (!selected.size) return;
  if (!confirm(`선택한 ${selected.size}건을 목록에서 삭제할까요?\n(DB에는 그대로 남고 화면에서만 숨겨집니다)`)) return;
  const r = await adminFetch('/api/deposits/hide', { method: 'POST', body: JSON.stringify({ ids: [...selected] }) });
  if (!r) return;
  if (!r.ok) { alert((await r.json()).error || '삭제 실패'); return; }
  load();
};

// ---- 주문 확인(관리자) ----
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const closeModal = () => { $('modal').classList.remove('open'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(); };
async function adminFetch(path, opts = {}) {
  const send = (t) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: 'Bearer ' + t } });
  // 로그인한 토큰이 관리자 권한도 가지면 그대로 처리한다. 아닐 때만 한 번 물어본다.
  let r = await send(adminToken || token);
  if (r.status !== 401) return r;
  adminToken = (prompt('관리자 토큰을 입력하세요') || '').trim();
  if (!adminToken) return null;
  r = await send(adminToken);
  if (r.status === 401) { adminToken = ''; localStorage.removeItem('adminToken'); alert('관리자 토큰이 올바르지 않습니다'); return null; }
  localStorage.setItem('adminToken', adminToken);
  return r;
}
async function openMatch(d) {
  const r = await adminFetch(`/api/deposits/${d.id}/matches`);
  if (!r) return;
  const sheet = $('sheet'); sheet.replaceChildren();
  requestAnimationFrame(() => $('modal').classList.add('open'));
  if (!r.ok) { sheet.append(el('h2', '', '조회 실패'), el('div', 'err', (await r.json()).error || r.status), actionsRow()); return; }
  const data = await r.json();
  const rel = data.related || { name: [], amount: [], other: [] };
  sheet.append(el('h2', '', `${d.sender || '(입금자 미확인)'} · ${won(d.amount)}`), el('div', 'sub', '최근 60일 주문 기준'));

  const section = (title, orders, kind) => {
    if (!orders.length) return;
    sheet.append(el('div', 'sec', `${title} (${orders.length})`));
    for (const o of orders) {
      const card = el('div', 'order');
      const head = el('div', 'head'); head.append(el('span', '', `주문 ${o.od_id}`), el('span', '', kind === 'full' ? won(o.od_misu) : `${o.od_status}`));
      card.append(head, el('div', 'meta', `주문자 ${o.od_name} · 입금자 ${o.od_deposit_name || '(없음)'} · ${fmtTime(o.od_time)}`));
      if (kind === 'name') card.append(el('div', 'diff', `금액 다름: 주문 미수금 ${won(o.od_misu)} / 상품+배송 ${won(o.od_total)} ↔ 입금 ${won(d.amount)}`));
      if (kind === 'amount') card.append(el('div', 'diff', `이름 다름: 주문 ${o.od_deposit_name || o.od_name} ↔ 입금 ${d.sender || '(미확인)'}`));
      if (kind === 'other') card.append(el('div', 'diff', `이미 '${o.od_status}' 상태입니다 (입금액 ${won(o.od_receipt_price)})`));
      for (const i of o.items) {
        const row = el('div', 'item');
        const nm = el('span', '', `${i.name} × ${i.qty}`);
        if (i.option) nm.append(el('div', 'opt', i.option));
        row.append(nm, el('span', '', won(i.subtotal)));
        card.append(row);
      }
      if (o.od_send_cost) { const row = el('div', 'item'); row.append(el('span', '', '배송비'), el('span', '', won(o.od_send_cost))); card.append(row); }
      if (kind === 'full') {
        const act = el('div', 'actions'); const ok = el('button', 'btn primary', '주문완료 (입금 처리)');
        ok.onclick = () => confirmOrder(d, o, ok, card);
        act.append(ok); card.append(act);
      } else {
        card.append(el('div', 'note', '이름·금액이 모두 일치하지 않아 여기서 처리할 수 없습니다. 쇼핑몰 관리자에서 확인하세요.'));
      }
      sheet.append(card);
    }
  };
  section('이름·금액 일치 — 처리 가능', data.candidates, 'full');
  section('이름만 일치', rel.name, 'name');
  section('금액만 일치', rel.amount, 'amount');
  section('다른 상태의 주문 (이름·금액 일치)', rel.other, 'other');
  if (!data.candidates.length && !rel.name.length && !rel.amount.length && !rel.other.length) sheet.append(el('div', 'empty', '관련된 주문이 없습니다'));
  sheet.append(actionsRow());
}
function actionsRow() {
  const a = el('div', 'actions'); const c = el('button', 'btn', '닫기'); c.onclick = closeModal; a.append(c); return a;
}
async function confirmOrder(d, o, btn, card) {
  if (!confirm(`주문 ${o.od_id} (${o.od_name}, ${won(o.od_misu)})을 입금 처리할까요?\n쇼핑몰 주문 상태가 '입금'으로 바뀝니다.`)) return;
  btn.disabled = true;
  const r = await adminFetch(`/api/deposits/${d.id}/confirm`, { method: 'POST', body: JSON.stringify({ od_id: o.od_id }) });
  if (!r) { btn.disabled = false; return; }
  if (!r.ok) { btn.disabled = false; card.append(el('div', 'err', (await r.json()).error || '처리 실패')); return; }
  closeModal(); load();
}

// ---- 이벤트 ----
document.querySelectorAll('.chip').forEach((c) => c.onclick = () => setRange(c.dataset.range));
for (const id of ['from', 'to']) {
  $(id).onchange = () => { state[id] = $(id).value; state.range = ''; state.page = 1; load(); };
}
$('limit').onchange = () => { state.limit = Number($('limit').value); state.page = 1; load(); };
let qTimer;
$('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $('q').value.trim(); state.page = 1; load(); }, 300); };
$('prev').onclick = () => { state.page -= 1; load(); };
$('next').onclick = () => { state.page += 1; load(); };

function showLogin() { $('app').hidden = true; $('login').hidden = false; }
$('loginBtn').onclick = () => { token = $('tokenInput').value.trim(); localStorage.setItem('viewToken', token); setRange('today'); };
$('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
token ? setRange('today') : showLogin();
</script>
