<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 입금 내역</title>
<style>
  :root { --rate:#1f6feb; --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#6b7480; --accent:#1f9d55; --line:#e6e8ec; --chip:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { --rate:#79b8ff; --bg:#12151a; --card:#1b1f26; --text:#e8eaed; --muted:#8b949e; --accent:#3ddc84; --line:#2a2f38; --chip:#262b34; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:16px 12px 48px; } /* 최대 1200px, 그보다 좁은 화면은 꽉 채움 */
  /* 왼쪽: 무통장 미입금 주문(쇼핑몰 연동 + PC 화면). 넓은 화면에서만 옆에, 좁으면 위에, 앱(compact)에서는 숨김 */
  #ordPanel .card { padding:12px 12px 6px; }
  .ordHead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; font-size:16px; }
  .ordQuick { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; } .ordQuick .chip { padding:4px 12px; font-size:13px; }
  .ordDates { display:flex; gap:6px; align-items:center; margin-bottom:6px; } .ordDates input { flex:1; padding:6px 6px; font-size:13px; }
  #ordInfo { margin:2px 2px 6px; }
  #ordList { list-style:none; margin:0; padding:0; }
  #ordList li { border-top:1px solid var(--line); padding:10px 2px; }
  #ordList .o1 { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  #ordList .nm { font-weight:700; font-size:15px; overflow-wrap:anywhere; }
  #ordList .krw { font-weight:700; font-size:16px; white-space:nowrap; }
  #ordList .o2 { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
  #ordList .it { font-size:13px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ordList .hit { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); margin-left:4px; }
  #ordList a { color:var(--rate); text-decoration:none; }
  @media (min-width:1100px) {
    body:not(.compact) main { max-width:1600px; display:grid; grid-template-columns:360px minmax(0,1fr); gap:20px; align-items:start; }
    body:not(.compact) #ordPanel { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  }
  @media (max-width:1099px) { #ordPanel { margin-bottom:12px; } #ordList { max-height:50vh; overflow:auto; } }
  /* 앱(compact): 위쪽 탭으로 입금 내역 / 무통장 주문 전환, 상세는 전체 화면 */
  .appTabs { display:none; }
  .compact .appTabs:not([hidden]) { display:flex; gap:6px; margin:0 0 10px; position:sticky; top:0; z-index:20; background:var(--bg); padding:6px 0; }
  .appTabs button { flex:1; font:inherit; font-size:15px; font-weight:600; padding:9px 0; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .appTabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .compact:not(.ordMode) #ordPanel { display:none !important; }
  .compact.ordMode #content { display:none; }
  .compact #ordList { max-height:none; }
  .compact #ordDrawer { left:0 !important; right:0; top:0; bottom:0; width:auto; border-radius:0; border:0; }
  .ordSum { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0 6px; }
  .ordSum div { border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; color:var(--muted); line-height:1.35; }
  .smsWrap { margin:10px 0 4px; } .smsWrap .sec { font-size:13px; color:var(--muted); margin-bottom:4px; }
  .smsBox { display:inline-block; max-width:320px; background:#e9e9eb; color:#111; border-radius:18px; padding:10px 14px; font-size:14px; line-height:1.45; white-space:pre-line; overflow-wrap:anywhere; }
  @media (prefers-color-scheme: dark) { .smsBox { background:#2c313a; color:#e8eaed; } }
  .smsBox.none { background:transparent; border:1px dashed var(--line); color:var(--muted); }
  .ordSum b { display:block; font-size:16px; color:var(--text); } .ordSum small { display:block; margin-top:2px; font-size:11px; color:var(--muted); } .ordSum .p b { color:#d97706; } .ordSum .d b { color:var(--accent); }
  #ordList li { cursor:pointer; border-radius:8px; } #ordList li:hover { background:var(--chip); }
  #ordList li.sel { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  #ordDrawer { position:fixed; top:12px; bottom:12px; width:440px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.18); z-index:60; overflow:auto; padding:14px 16px; transform:translateX(-24px); opacity:0; transition:transform .18s, opacity .18s; }
  #ordDrawer.open { transform:none; opacity:1; }
  @media (max-width:1099px) { #ordDrawer { left:8px !important; right:8px; width:auto; } }
  .dHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; font-size:17px; }
  .dRow { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); margin:2px 0; }
  .dAmt { font-size:24px; font-weight:800; margin:4px 0 2px; }
  .dItem { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .dItem img { width:64px; height:64px; object-fit:cover; border-radius:8px; background:var(--chip); }
  .dItem .nm { font-weight:600; font-size:14px; overflow-wrap:anywhere; color:var(--text); text-decoration:none; } .dItem .nm:hover { text-decoration:underline; } .dItem .op { font-size:13px; color:var(--muted); line-height:1.45; overflow-wrap:anywhere; }
  .dItem .pq { font-size:13px; margin-top:2px; }
  .dSec { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .dSec h4 { margin:0 0 6px; font-size:14px; }
  .dDep { display:flex; gap:8px; align-items:flex-start; padding:6px 4px; font-size:14px; cursor:pointer; }
  .dDep small { color:var(--muted); display:block; font-size:12px; }
  #dMemo { width:100%; min-height:70px; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  #dGo { width:100%; margin-top:8px; padding:10px; font-size:16px; background:var(--accent); color:#fff; border-color:var(--accent); }
  #dMsg { margin-top:6px; font-size:13px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .status { font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c0392b; margin-right:6px; }
  .dot.on { background:var(--accent); }
  .sumcap { font-size:13px; color:var(--muted); margin:-4px 2px 8px; }
  .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:16px; }
  .summary .card { padding:12px 14px; }
  .summary .value { font-size:clamp(17px, 2.1vw, 24px); white-space:nowrap; }
  .summary .subnote { font-size:12px; color:var(--muted); margin-top:2px; }
  @media (max-width:560px) { .summary { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .label { font-size:13px; color:var(--muted); }
  .card .value { font-size:26px; font-weight:700; margin-top:2px; }
  .filters { margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--chip); color:var(--text); border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .row .sep { color:var(--muted); }
  input, select { font:inherit; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=search] { flex:1; min-width:140px; }
  .list { padding:0; overflow:hidden; }
  ul { list-style:none; margin:0; padding:0; }
  #list li { display:grid; grid-template-columns:30px minmax(0,1fr) 270px; column-gap:14px; align-items:start; padding:14px 16px; border-bottom:1px solid var(--line); }
  #list.shop li { grid-template-columns:30px minmax(0,1fr) 270px 96px; }
  #list li > input[type=checkbox] { margin-top:4px; }
  li .main { min-width:0; }
  .dates { display:flex; flex-wrap:wrap; gap:2px 16px; font-size:13px; color:var(--muted); margin-top:2px; }
  .dates em { font-style:normal; color:var(--muted); margin-right:4px; }
  .dates span { color:var(--text); }
  .dates span em { color:var(--muted); }
  .ordline { font-size:13px; color:var(--muted); margin-top:8px; }
  .pitems { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .pitem { display:flex; gap:10px; align-items:flex-start; }
  .pitem .pic { width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--chip); flex:none; }
  .pitem .pbody { min-width:0; flex:1; }
  .pitem .pn { font-size:14px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
  .pitem .po { font-size:13px; color:var(--muted); line-height:1.4; overflow-wrap:anywhere; }
  .pitem .pq { font-size:12px; color:var(--muted); }
  .amtbox { text-align:right; }
  .amtbox .badge { display:inline-block; margin-top:5px; }
  .amtbox .usd { font-size:13px; color:var(--muted); margin-top:5px; line-height:1.45; }
  .amtbox .usd b { color:var(--text); font-size:16px; }
  .slot { display:flex; justify-content:flex-end; align-items:flex-start; }
  .slot .btn { width:100%; }
  li .chev { display:none; }
  /* 앱(compact): 행은 최소화하고 자세한 내용은 눌러서 상세 패널에서 본다 */
  .compact main { padding:8px 6px 40px; }
  .compact .legend { display:none; }
  .compact #list li, .compact #list.shop li { grid-template-columns:24px minmax(0,1fr) auto 14px; column-gap:10px; padding:11px 10px; align-items:center; cursor:pointer; }
  .compact #list li > input[type=checkbox] { margin-top:0; }
  .compact .dates span:not(:first-child) { display:none; }
  .compact .who { font-size:16px; }
  .compact .amt { font-size:19px; }
  .compact li .memo, .compact .slot { display:none; }
  .compact li .chev { display:block; color:var(--muted); font-size:22px; line-height:1; }
  .daynav { display:none; }
  .daypick { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  .compact .daynav { display:flex; align-items:center; gap:6px; position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 8px; margin-bottom:6px; }
  .daynav .navbtn { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; font-size:22px; line-height:1; padding:8px 14px; cursor:pointer; }
  .daynav .navbtn.small { font-size:13px; padding:10px 10px; }
  .daynav .navbtn:disabled { opacity:.35; }
  .daynav .daylabel { flex:1; min-width:0; text-align:center; font-weight:700; font-size:17px; padding:9px 6px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; cursor:pointer; }
  .compact .filters { display:none; }
  .compact.showfilters .filters { display:block; }
  @keyframes inFromRight { from { transform:translateX(28px); opacity:.25; } }
  @keyframes inFromLeft { from { transform:translateX(-28px); opacity:.25; } }
  .slideNext { animation:inFromRight .22s ease-out; } .slidePrev { animation:inFromLeft .22s ease-out; }
  .dtab { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:15px; margin:10px 0; }
  .dtab dt { color:var(--muted); } .dtab dd { margin:0; font-weight:600; }
  @media (max-width:760px) {
    #list li, #list.shop li { grid-template-columns:30px minmax(0,1fr); }
    #list li .amtbox { grid-column:2; text-align:left; margin-top:6px; }
    #list li .slot { grid-column:2; margin-top:6px; justify-content:flex-start; }
    #list li .slot .btn { width:auto; padding:6px 16px; }
  }
  .compact #list li, .compact #list.shop li { grid-template-columns:24px minmax(0,1fr) auto 14px; column-gap:10px; align-items:center; }
  .compact #list li .amtbox { grid-column:auto; text-align:right; margin-top:0; }
  li:last-child { border-bottom:0; }
  li.new { animation:flash 2.5s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 25%, transparent); } to { background:transparent; } }
  .who { font-weight:600; } .when { font-size:13px; color:var(--muted); }
  .amt { color:var(--accent); font-weight:700; font-size:21px; }
  .empty { padding:32px; text-align:center; color:var(--muted); }
  .pager { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:16px; font-size:14px; color:var(--muted); }
  .pager button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .btn { border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .chart { margin-bottom:16px; padding:16px 18px 14px; }
  .charthead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .charthead b { font-size:17px; }
  .chartsub { font-size:13px; color:var(--muted); margin-left:6px; }
  .charttotal { font-size:14px; color:var(--muted); } .charttotal b { color:var(--text); font-size:16px; }
  .chartlegend { display:flex; gap:14px; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  .chartlegend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .bars { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:5px; align-items:end; margin-top:6px; }
  .bar { display:flex; flex-direction:column; align-items:stretch; min-width:0; }
  .bar.click { cursor:pointer; }
  .bar .val { height:18px; font-size:11px; font-weight:600; color:var(--muted); text-align:center; white-space:nowrap; overflow:visible; line-height:18px; }
  .bar .track { height:130px; background:var(--chip); border-radius:6px; display:flex; flex-direction:column-reverse; overflow:hidden; }
  .bar:hover .track { box-shadow:0 0 0 2px color-mix(in srgb, var(--rate) 45%, transparent); }
  .bar .seg.done { background:var(--accent); } .bar .seg.pend { background:var(--rate); }
  .bar .lab { height:20px; font-size:11px; color:var(--muted); text-align:center; margin-top:4px; white-space:nowrap; line-height:20px; }
  .chartnote { font-size:13px; color:var(--muted); margin-top:6px; text-align:center; }
  .compact .chart { padding:12px 10px 10px; }
  .compact .bar .track { height:90px; }
  .compact .charthead b { font-size:15px; }
  .btn.primary { background:var(--accent); color:#fff; font-weight:600; }
  li.m-full { background:color-mix(in srgb, var(--accent) 13%, transparent); }
  li.m-name { background:color-mix(in srgb, #e6a100 17%, transparent); }
  li.m-amount { background:color-mix(in srgb, #2d7ff9 14%, transparent); }
  li.m-other { background:color-mix(in srgb, #8b949e 18%, transparent); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin:-6px 0 12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .sec { font-size:13px; font-weight:700; margin:16px 0 0; }
  .diff { font-size:12px; color:#c0392b; margin:0 0 6px; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  li.done { background:color-mix(in srgb, var(--accent) 26%, transparent); }
  li > input[type=checkbox], .toolbar input[type=checkbox] { width:18px; height:18px; flex:none; accent-color:var(--accent); }
  .topright { display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .doneToggle { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; }
  .doneToggle input { width:16px; height:16px; accent-color:var(--accent); }
  .doneToggle[hidden] { display:none; }
  .listbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:0 4px 8px; font-size:14px; color:var(--muted); }
  .listbarR { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .listbar label { display:flex; align-items:center; gap:8px; }
  .listbar input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #qBtn { padding:8px 18px; font-size:14px; border-radius:8px; }
  .btn.danger { border-color:#c0392b; color:#c0392b; }
  .btn:disabled { opacity:.4; cursor:default; }
  /* 메모는 입금 행 아래의 전체 너비 한 줄(체크박스 폭만큼 들여쓰기) */
  .memo { grid-column:1 / -1; box-sizing:border-box; padding:7px 0 0 44px; font-size:14px; display:flex; gap:8px; align-items:baseline; }
  .memo[hidden] { display:none; }
  .memo input { flex:1; min-width:0; }
  .memotext { color:#b36b00; font-weight:600; overflow-wrap:anywhere; }
  .memo input { padding:5px 8px; font-size:14px; }
  .link { background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  .memobox textarea { width:100%; min-height:64px; font:inherit; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; }
  .memobox .actions { margin-top:6px; }
  .btn.warn { border-color:#b36b00; color:#b36b00; }
  .btn.warn.primary { background:#b36b00; color:#fff; border-color:#b36b00; }
  .badge.auto { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); font-weight:700; }
  .badge.matched { background:color-mix(in srgb, #0d9488 22%, transparent); color:#0f766e; font-weight:700; }
  .badge.linked { background:color-mix(in srgb, #2563eb 20%, transparent); color:#1d4ed8; font-weight:700; }
  .btn.info { border-color:#2563eb; color:#2563eb; }
  .btn.info.primary { background:#2563eb; color:#fff; }
  .badge.manual { background:color-mix(in srgb, #d97706 24%, transparent); color:#b45309; font-weight:700; }
  @media (prefers-color-scheme: dark) { .badge.manual { color:#fbbf24; } .badge.linked { color:#93c5fd; } .badge.matched { color:#5eead4; } }
  .badge { font-size:12px; color:var(--muted); background:var(--chip); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  /* 오른쪽에서 밀려 나오는 상세 패널 */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; opacity:0; pointer-events:none; transition:opacity .2s; }
  #modal.open { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--card); padding:18px; overflow:auto;
           border-radius:14px 0 0 14px; box-shadow:-8px 0 24px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .25s ease; }
  #modal.open .sheet { transform:none; }
  .ordinfo { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4; overflow-wrap:anywhere; }
  .sheet h2 { font-size:21px; margin:0 0 4px; }
  .sheet .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .order { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; }
  .item { align-items:flex-start; padding:8px 0; }
  .item .pic { width:56px; height:56px; object-fit:cover; border-radius:8px; background:var(--chip); flex:none; }
  .item .info { flex:1; min-width:0; overflow-wrap:anywhere; }
  .item .info .pricing { font-size:15px; font-weight:600; color:var(--muted); margin-top:2px; }
  .item .money { text-align:right; white-space:nowrap; font-size:20px; font-weight:800; }
  .item .money small { display:block; font-size:15px; font-weight:600; color:var(--muted); }
  a.btn { text-decoration:none; display:inline-block; margin-top:6px; font-size:12px; padding:4px 10px; }
  .calc { font-size:12px; line-height:1.6; color:var(--muted); margin:2px 0 6px; }
  .calc b { color:var(--text); }
  .calc .ok { color:var(--accent); font-weight:700; }
  .calc .bad { color:#c0392b; font-weight:700; }
  .ratebig { font-size:28px; font-weight:800; color:var(--rate); line-height:1.25; }
  .ratebig small { font-size:16px; font-weight:700; }
  .ratenum { color:var(--rate); }
  .ratesrc { font-size:12px; color:var(--muted); margin-top:2px; }
  .bigcalc { background:var(--chip); border-radius:10px; padding:10px 12px; margin:8px 0; }
  .bigcalc .l1 { font-size:21px; font-weight:800; }
  .bigcalc .l2 { font-size:24px; font-weight:800; margin-top:2px; }
  .bigcalc .l3 { font-size:17px; font-weight:600; margin-top:4px; }
  .bigcalc .l4 { font-size:13px; color:var(--muted); margin-top:2px; }
  .ratebar { font-size:12px; color:var(--muted); background:color-mix(in srgb, var(--rate) 12%, transparent); border-left:4px solid var(--rate); border-radius:8px; padding:8px 12px; margin-top:8px; }
  .order .head span:last-child { font-size:26px; font-weight:800; }
  .order .head { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .order .meta { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .item { display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3px 0; border-top:1px dashed var(--line); }
  .item .opt { color:var(--muted); font-size:12px; }
  .sheet .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .err { color:#c0392b; font-size:13px; margin-top:8px; }
  #login { max-width:320px; margin:20vh auto; text-align:center; }
  #login input, #login button { width:100%; padding:12px; margin-top:10px; font-size:16px; border-radius:8px; border:1px solid var(--line); }
  #login button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>입금 모니터</h1>
  <input id="tokenInput" type="password" placeholder="접속 토큰" autocomplete="current-password">
  <button id="loginBtn">접속</button>
</div>
<main id="app" hidden>
<div class="appTabs" id="appTabs" hidden><button class="on" data-t="dep">입금 내역</button><button data-t="ord">무통장 주문</button></div>
<aside id="ordPanel" hidden>
  <div class="card">
    <div class="ordHead"><b>무통장 미입금 주문</b> <span id="ordCount" class="status"></span></div>
    <div class="ordQuick">
      <button class="chip" data-o="0">오늘</button><button class="chip" data-o="1">어제</button><button class="chip" data-o="6">7일</button><button class="chip" data-o="29">30일</button>
    </div>
    <div class="ordDates"><input type="date" id="ordFrom"> <span class="sep">~</span> <input type="date" id="ordTo"> <button class="btn" id="ordGo">검색</button></div>
    <div class="ordSum" id="ordSum"></div>
    <div id="ordInfo" class="status"></div>
    <ul id="ordList"></ul>
  </div>
</aside>
<div id="ordDrawer" hidden><div class="dHead"><b id="dTitle"></b><button class="btn" id="dClose">닫기</button></div><div id="dBody"></div></div>
<div id="content">
  <header>
    <h1>실시간 입금 내역</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  </header>

  <div class="daynav" id="dayNav">
    <button class="navbtn" id="dayPrev" aria-label="이전 날">‹</button>
    <button class="daylabel" id="dayLabel">오늘</button>
    <button class="navbtn" id="dayNext" aria-label="다음 날">›</button>
    <button class="navbtn small" id="dayToday">오늘</button>
    <button class="navbtn small" id="filterToggle">필터</button>
    <input type="date" id="dayPick" class="daypick" tabindex="-1" aria-hidden="true">
  </div>
  <div class="sumcap" id="sumCap"></div>
  <div class="summary" id="summary">
    <div class="card"><div class="label">미처리 금액</div><div class="value" id="sumPendingTotal">0원</div></div>
    <div class="card" id="cardDoneTotal"><div class="label">처리완료 금액</div><div class="value" id="sumDoneTotal">0원</div></div>
    <div class="card"><div class="label">입금 건수</div><div class="value" id="sumAllCount">0건</div><div class="subnote" id="sumPendingCount"></div></div>
    <div class="card" id="cardDoneCount"><div class="label">처리완료 건수</div><div class="value" id="sumDoneCount">0건</div><div class="subnote" id="sumDoneSplit"></div></div>
  </div>

  <div class="card chart" id="chartCard">
    <div class="charthead"><div><b>기간별 입금 금액</b> <span class="chartsub" id="chartSub"></span></div><div class="charttotal" id="chartTotal"></div></div>
    <div class="chartlegend" id="chartLegend"></div>
    <div class="bars" id="bars"></div>
    <div class="chartnote" id="chartNote"></div>
  </div>

  <div class="card filters">
    <div class="chips" id="chips">
      <button class="chip" data-range="today">오늘</button>
      <button class="chip" data-range="yesterday">어제</button>
      <button class="chip" data-range="thisWeek">이번주</button>
      <button class="chip" data-range="lastWeek">저번주</button>
      <button class="chip" data-range="all">전체</button>
    </div>
    <div class="row">
      <select id="datefield" aria-label="일자 기준" hidden>
        <option value="all">전체</option>
        <option value="order">주문일자</option>
        <option value="paid" selected>결제일자</option>
      </select>
      <input type="date" id="from" aria-label="시작일자">
      <span class="sep">~</span>
      <input type="date" id="to" aria-label="종료일자">
      <select id="limit" aria-label="보기 개수">
        <option value="10">10개씩</option>
        <option value="20" selected>20개씩</option>
        <option value="50">50개씩</option>
        <option value="100">100개씩</option>
      </select>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="입금자 검색" aria-label="입금자 검색">
      <button class="btn primary" id="qBtn">검색</button>
    </div>
  </div>

  <div class="err" id="matchErr" hidden></div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:color-mix(in srgb,var(--accent) 45%,transparent)"></i>이름·금액 일치</span>
    <span><i style="background:color-mix(in srgb,#e6a100 55%,transparent)"></i>이름만 일치</span>
    <span><i style="background:color-mix(in srgb,#2d7ff9 50%,transparent)"></i>금액만 일치</span>
    <span><i style="background:color-mix(in srgb,#8b949e 55%,transparent)"></i>다른 상태 주문</span>
    <span><i style="background:color-mix(in srgb,var(--accent) 80%,transparent)"></i>자동처리(시스템)</span>
    <span><i style="background:color-mix(in srgb,#0d9488 80%,transparent)"></i>일치처리(관리자 확인)</span>
    <span><i style="background:color-mix(in srgb,#d97706 80%,transparent)"></i>수동처리(사유 입력)</span>
    <span><i style="background:color-mix(in srgb,#2563eb 80%,transparent)"></i>기처리 연결(이미 처리된 주문)</span>
  </div>
  <div class="listbar">
    <label><input type="checkbox" id="selAll"> 전체 선택</label>
    <span class="listbarR">
      <label class="doneToggle" id="doneToggle" hidden><input type="checkbox" id="doneOnly"> 처리완료만 보기</label>
      <button class="btn" id="manualBtn" title="알림을 자동으로 받지 못하는 계좌(iPhone 등)의 입금을 직접 넣는다">＋ 입금 직접 입력</button>
      <span id="selCount" class="status"></span> <button class="btn danger" id="hideBtn" disabled>선택 삭제</button>
    </span>
  </div>
  <div class="card list"><ul id="list"></ul></div>
  <div class="pager">
    <button id="prev">이전</button>

    <button id="next">다음</button>
  </div>
</div>
</main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
// 앱(WebView)이 주소 뒤에 #token=… 을 붙여 열면 로그인 없이 들어온다(해시는 서버로 전송되지 않는다).
try {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) {
    localStorage.setItem('viewToken', decodeURIComponent(m[1]));
    if (/[#&]app=1/.test(location.hash)) localStorage.setItem('compact', '1'); // 앱에서 열면 목록을 최소화한다
    history.replaceState(null, '', location.pathname + location.search);
  }
} catch {}
let COMPACT = false;
try { COMPACT = localStorage.getItem('compact') === '1' || new URLSearchParams(location.search).has('compact'); } catch {}
document.body.classList.toggle('compact', COMPACT);
let token = localStorage.getItem('viewToken') || '';
const state = { from: '', to: '', q: '', limit: 20, page: 1, range: 'today', datefield: 'paid', done: false };
let es, highlightId = null, reqSeq = 0, shopEnabled = false, adminEnabled = false, rateNow = null, shopCurrency = null;
const selected = new Set();
const LEVEL_LABEL = { full: '이름·금액 일치', name: '이름만 일치', amount: '금액만 일치', other: '다른 상태 주문' };
let adminToken = localStorage.getItem('adminToken') || '';

// ---- 날짜 계산 (한국시간 기준 'YYYY-MM-DD') ----
const DAY = 86400000;
let lastDeposits = []; // 지금 목록의 입금(왼쪽 주문 목록의 '입금 있음' 표시용)
const ord = { from: '', to: '', loaded: false, seq: 0, sel: null }; // 왼쪽 무통장 주문 목록 상태
const kstNow = () => new Date(Date.now() + 9 * 3600000);
const ymd = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => ymd(new Date(Date.parse(s + 'T00:00:00Z') + n * DAY));
const weekStart = (s) => { const dow = new Date(s + 'T00:00:00Z').getUTCDay(); return addDays(s, -((dow + 6) % 7)); }; // 월요일 시작
function rangeDates(name) {
  const today = ymd(kstNow());
  switch (name) {
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case 'thisWeek': { const s = weekStart(today); return [s, addDays(s, 6)]; }
    case 'lastWeek': { const s = addDays(weekStart(today), -7); return [s, addDays(s, 6)]; }
    default: return ['', ''];
  }
}
const RANGE_LABEL = { today: '오늘', yesterday: '어제', thisWeek: '이번주', lastWeek: '저번주', all: '전체' };

// 쇼핑몰 DB의 시각은 한국시간 문자열('YYYY-MM-DD HH:MM:SS') 그대로 보여 준다(브라우저 시간대 변환 없음).
const kstText = (s) => (s ? s.slice(5, 16).replace('-', '.') : '');
function fmtTime(iso) {
  return new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
// 리스트에서 바로 메모(처리 사유)를 보고 고치는 부분.
//  link: 메모가 없을 때만 보이는 '메모' 링크(행 높이를 늘리지 않으려고 왼쪽 블록 안에 둔다)
//  row : 메모가 있거나 입력 중일 때만 보이는, 행 아래 전체 너비 한 줄
function memoParts(d) {
  const row = document.createElement('div'); row.className = 'memo';
  const link = document.createElement('button'); link.className = 'link'; link.textContent = '메모';
  const show = () => {
    row.replaceChildren();
    link.hidden = !!d.memo;
    row.hidden = !d.memo;
    if (!d.memo) return;
    const t = document.createElement('span'); t.className = 'memotext'; t.textContent = '📝 ' + d.memo;
    const b = document.createElement('button'); b.className = 'link'; b.textContent = '수정'; b.onclick = edit;
    row.append(t, b);
  };
  const edit = () => {
    link.hidden = true; row.hidden = false; row.replaceChildren();
    const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 500; inp.value = d.memo || ''; inp.placeholder = '메모 / 처리 사유';
    const save = document.createElement('button'); save.className = 'btn'; save.textContent = '저장';
    const cancel = document.createElement('button'); cancel.className = 'link'; cancel.textContent = '취소'; cancel.onclick = show;
    save.onclick = async () => {
      const r = await adminFetch(`api/deposits/${d.id}/memo`, { method: 'POST', body: JSON.stringify({ memo: inp.value }) });
      if (!r) return;
      if (!r.ok) { alert((await r.json()).error || '메모 저장 실패'); return; }
      d.memo = (await r.json()).memo; show();
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') show(); };
    row.append(inp, save, cancel); inp.focus();
  };
  link.onclick = edit;
  show();
  return { link, row };
}
// 날짜/시간 표기(한국시간): 입금·처리는 ISO(UTC), 주문은 쇼핑몰의 한국시간 문자열
const md = (iso) => { const t = new Date(Date.parse(iso) + 9 * 3600000).toISOString(); return t.slice(5, 10).replace('-', '.') + ' ' + t.slice(11, 19); };
const mdShop = (s) => (s ? s.slice(5, 10).replace('-', '.') + ' ' + s.slice(11, 19) : '');
const usdFmt = (n) => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 3 });
const KIND_NAME = ['auto', 'manual', 'linked', 'matched'];
const KIND_TEXT = { auto: '자동처리', manual: '수동처리', linked: '기처리', matched: '일치처리' };
const KIND_TITLE = { auto: '입금자·금액이 정확히 일치해 시스템이 자동으로 처리', matched: '이름·금액이 일치해 관리자가 확인 후 처리', manual: '이름·금액이 일치하지 않아 사유를 적고 수동으로 처리', linked: '쇼핑몰에서 이미 처리된 주문과 연결(주문 상태 변경 없음)' };
const optionsOf = (i) => (i.options && i.options.length ? i.options : i.option ? [i.option] : []);

function dateSpan(label, value) {
  const sp = document.createElement('span'); const em = document.createElement('em'); em.textContent = label;
  sp.append(em, value); return sp;
}
function badgeFor(d, withId) {
  const b = document.createElement('span'); b.className = 'badge';
  if (d.order_id) {
    const k = KIND_NAME[d.order_manual] || 'auto';
    b.classList.add(k); b.textContent = KIND_TEXT[k] + (withId ? ' #' + d.order_id : ''); b.title = KIND_TITLE[k];
    return b;
  }
  if (shopEnabled && d.match_level) { b.textContent = LEVEL_LABEL[d.match_level]; return b; }
  return null;
}
// 상품(이미지 + 이름 + 옵션을 한 줄에 하나씩 + 수량)
function itemsBlock(items, withPrice) {
  const wrap = document.createElement('div'); wrap.className = 'pitems';
  for (const i of items) {
    const row = document.createElement('div'); row.className = 'pitem';
    if (i.image) { const img = document.createElement('img'); img.className = 'pic'; img.src = i.image; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => { img.style.visibility = 'hidden'; }; row.append(img); }
    const body = document.createElement('div'); body.className = 'pbody';
    const n = document.createElement('div'); n.className = 'pn'; n.textContent = `${i.name}`;
    body.append(n);
    for (const o of optionsOf(i)) { const po = document.createElement('div'); po.className = 'po'; po.textContent = o; body.append(po); }
    const q = document.createElement('div'); q.className = 'pq';
    q.textContent = `수량 ${i.qty}` + (withPrice && i.price != null ? ` · ${shopCurrency === 'USD' ? usdFmt(i.price) + (i.price_krw != null ? ` (≈${won(i.price_krw)})` : '') : won(i.price)}` : '');
    body.append(q);
    if (withPrice && i.url) { const a = document.createElement('a'); a.className = 'btn'; a.textContent = '상품보기'; a.href = i.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; body.append(a); }
    row.append(body); wrap.append(row);
  }
  return wrap;
}

function renderRow(d) {
  const li = document.createElement('li');
  li.className = [d.id === highlightId ? 'new' : '', d.order_id ? 'done' : d.match_level ? 'm-' + d.match_level : ''].filter(Boolean).join(' ');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(d.id); cb.dataset.id = d.id;
  cb.onchange = () => { cb.checked ? selected.add(d.id) : selected.delete(d.id); updateToolbar(); };

  const main = document.createElement('div'); main.className = 'main';
  const who = document.createElement('div'); who.className = 'who'; who.textContent = d.sender || '(입금자 미확인)';
  if (COMPACT && d.memo) who.append(' 📝');
  const dates = document.createElement('div'); dates.className = 'dates';
  dates.append(dateSpan('입금', md(d.received_at)));
  if (d.order_id) {
    if (d.order_time) dates.append(dateSpan('주문', mdShop(d.order_time)));
    if (d.processed_at) dates.append(dateSpan('처리', md(d.processed_at)));
  }
  main.append(who, dates);
  const mp = adminEnabled && !COMPACT ? memoParts(d) : null;
  if (mp) main.append(mp.link);
  if (d.order_id && !COMPACT) {
    const ol = document.createElement('div'); ol.className = 'ordline'; ol.textContent = `주문 ${d.order_id}`;
    // 처리된 입금: 들어온 문자 원문을 늘 함께 보여준다
    main.append(ol, smsBlock(d.raw), itemsBlock(d.order_items || [], false));
  }

  // 금액 칸: 금액 / 처리 방식 뱃지 / 달러·적용환율(처리된 주문)
  const box = document.createElement('div'); box.className = 'amtbox';
  const amt = document.createElement('div'); amt.className = 'amt'; amt.textContent = '+' + won(d.amount);
  box.append(amt);
  const bd = badgeFor(d, !COMPACT);
  if (bd) box.append(bd);
  if (d.order_id && !COMPACT && shopCurrency === 'USD' && d.order_usd) {
    const u = document.createElement('div'); u.className = 'usd';
    const b1 = document.createElement('b'); b1.textContent = usdFmt(d.order_usd);
    u.append(b1);
    if (rateNow) { u.append(' · 적용환율 '); const b2 = document.createElement('b'); b2.textContent = rateNow.toLocaleString('ko-KR') + '원'; u.append(b2, '/$'); }
    box.append(u);
  }

  li.append(cb, main, box);
  if (shopEnabled) {
    const slot = document.createElement('div'); slot.className = 'slot';
    if (!d.order_id) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '주문 확인'; b.onclick = () => openMatch(d); slot.append(b); }
    li.append(slot);
  }
  if (COMPACT) {
    const chev = document.createElement('span'); chev.className = 'chev'; chev.textContent = '›'; li.append(chev);
    li.onclick = (e) => {
      if (e.target.closest('input,button,a')) return;
      if (d.order_id) openDetail(d); else if (shopEnabled) openMatch(d);
    };
  }
  if (mp) li.append(mp.row);
  return li;
}

// 처리 완료된 입금의 상세(앱에서 행을 눌렀을 때): 일시, 달러/환율, 상품(이미지·옵션), 메모
// 입금이 들어온 원문(카카오뱅크 문자/알림)을 문자 말풍선처럼 보여준다. 저장된 원문은 줄바꿈이 합쳐져 있어 항목별로 다시 나눈다.
function smsBlock(raw) {
  const w = el('div', 'smsWrap'); w.append(el('div', 'sec', '입금 문자(원문)'));
  const t = String(raw || '');

function renderChart(c) {

  const n = c.buckets.length;
  const step = n > 16 ? Math.ceil(n / 16) : 1;
  $('chartSub').textContent = `${{ hour: '시간별', day: '일별', month: '월별' }[c.unit]} · ${c.from === c.to ? c.from : c.from + ' ~ ' + c.to}`;
  const all = c.totals.pending + c.totals.done;
  $('chartTotal').replaceChildren('총 ', Object.assign(document.createElement('b'), { textContent: won(all) }), ` · ${c.totals.count}건`);
  $('chartLegend').innerHTML = shopEnabled

const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

function updateDayNav() {

  const area = document.querySelector('main');
  area.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || e.target.closest('input,select,textarea,.filters')) { tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); tracking = true;

    ? `주문 ${o.od_id} (${o.od_name})는 쇼핑몰에서 이미 '${o.od_status}' 상태입니다.\n주문 상태는 바꾸지 않고, 이 입금(${won(d.amount)}, ${d.sender || '입금자 미확인'})을 그 주문과 연결해 처리 완료로 표시합니다.\n\n사유: ${memo}`
    : mode === 'manual'
      ? `주문 ${o.od_id} (${o.od_name}, 미수금 ${money})은 입금 ${won(d.amount)} / ${d.sender || '입금자 미확인'}와(과) 일치하지 않습니다.\n그래도 입금 처리할까요?\n\n사유: ${memo}`
      : `주문 ${o.od_id} (${o.od_name}, ${money})을 입금 처리할까요?\n쇼핑몰 주문 상태가 '입금'으로 바뀝니다.`;
  if (!confirm(msg)) return;
  btn.disabled = true;
  const r = await adminFetch(`api/deposits/${d.id}/confirm`, { method: 'POST', body: JSON.stringify({ od_id: o.od_id, memo }) });
  if (!r) { btn.disabled = false; return; }
  if (!r.ok) { btn.disabled = false; card.append(el('div', 'err', (await r.json()).error || '처리 실패')); return; }
  closeModal(); load();
}

// ---- 이벤트 ----
document.querySelectorAll('.chip[data-range]').forEach((c) => c.onclick = () => setRange(c.dataset.range));
for (const id of ['from', 'to']) {
  $(id).onchange = () => { state[id] = $(id).value; state.range = ''; state.page = 1; load(); };
}
$('datefield').onchange = () => { state.datefield = $('datefield').value; state.page = 1; load(); };
$('limit').onchange = () => { state.limit = Number($('limit').value); state.page = 1; load(); };
const runSearch = () => { state.q = $('q').value.trim(); state.page = 1; load(); };
$('qBtn').onclick = runSearch;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
$('doneOnly').onchange = () => { state.done = $('doneOnly').checked; state.page = 1; load(); };
$('prev').onclick = () => { state.page -= 1; load(); };
$('next').onclick = () => { state.page += 1; load(); };

function showLogin() { $('app').hidden = true; $('login').hidden = false; }
$('loginBtn').onclick = () => { token = $('tokenInput').value.trim(); localStorage.setItem('viewToken', token); setRange('today'); };
$('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
token ? setRange('today') : showLogin();
</script>
</body>
