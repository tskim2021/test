<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 입금 내역</title>
<style>
  :root { --rate:#1f6feb; --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#6b7480; --accent:#1f9d55; --line:#e6e8ec; --chip:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { --rate:#79b8ff; --bg:#12151a; --card:#1b1f26; --text:#e8eaed; --muted:#8b949e; --accent:#3ddc84; --line:#2a2f38; --chip:#262b34; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .status { font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c0392b; margin-right:6px; }
  .dot.on { background:var(--accent); }
  .sumcap { font-size:13px; color:var(--muted); margin:-4px 2px 8px; }
  .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:16px; }
  .summary .card { padding:12px 14px; }
  .summary .value { font-size:22px; }
  .summary .subnote { font-size:12px; color:var(--muted); margin-top:2px; }
  @media (max-width:560px) { .summary { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .label { font-size:13px; color:var(--muted); }
  .card .value { font-size:26px; font-weight:700; margin-top:2px; }
  .filters { margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--chip); color:var(--text); border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .row .sep { color:var(--muted); }
  input, select { font:inherit; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=search] { flex:1; min-width:140px; }
  .list { padding:0; overflow:hidden; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li.new { animation:flash 2.5s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 25%, transparent); } to { background:transparent; } }
  .who { font-weight:600; } .when { font-size:13px; color:var(--muted); }
  .amt { color:var(--accent); font-weight:700; font-size:21px; }
  .empty { padding:32px; text-align:center; color:var(--muted); }
  .pager { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:16px; font-size:14px; color:var(--muted); }
  .pager button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .right { display:flex; align-items:center; gap:12px; }
  .btn { border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .amtcol { min-width:124px; text-align:right; }
  .slot { width:84px; display:flex; justify-content:flex-end; }
  .slot .btn { width:100%; }
  @media (max-width:560px) {
    li { flex-wrap:wrap; row-gap:6px; }
    li .right { width:100%; justify-content:flex-end; }
  }
  .btn.primary { background:var(--accent); color:#fff; font-weight:600; }
  li.m-full { background:color-mix(in srgb, var(--accent) 13%, transparent); }
  li.m-name { background:color-mix(in srgb, #e6a100 17%, transparent); }
  li.m-amount { background:color-mix(in srgb, #2d7ff9 14%, transparent); }
  li.m-other { background:color-mix(in srgb, #8b949e 18%, transparent); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin:-6px 0 12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .sec { font-size:13px; font-weight:700; margin:16px 0 0; }
  .diff { font-size:12px; color:#c0392b; margin:0 0 6px; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  li.done { background:color-mix(in srgb, var(--accent) 26%, transparent); }
  .lhs { display:flex; align-items:center; gap:12px; min-width:0; }
  .lhs { flex:1 1 0; }
  .lhs input[type=checkbox], .toolbar input[type=checkbox] { width:18px; height:18px; flex:none; accent-color:var(--accent); }
  .topright { display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .doneToggle { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; }
  .doneToggle input { width:16px; height:16px; accent-color:var(--accent); }
  .doneToggle[hidden] { display:none; }
  .listbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:0 4px 8px; font-size:14px; color:var(--muted); }
  .listbarR { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .listbar label { display:flex; align-items:center; gap:8px; }
  .listbar input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #qBtn { padding:8px 18px; font-size:14px; border-radius:8px; }
  .btn.danger { border-color:#c0392b; color:#c0392b; }
  .btn:disabled { opacity:.4; cursor:default; }
  /* 메모는 입금 행 아래의 전체 너비 한 줄(체크박스 폭만큼 들여쓰기) */
  .memo { flex:0 0 100%; box-sizing:border-box; padding:7px 0 0 30px; font-size:14px; display:flex; gap:8px; align-items:baseline; }
  .memo[hidden] { display:none; }
  .memo input { flex:1; min-width:0; }
  .memotext { color:#b36b00; font-weight:600; overflow-wrap:anywhere; }
  .memo input { padding:5px 8px; font-size:14px; }
  .link { background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  .memobox textarea { width:100%; min-height:64px; font:inherit; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; }
  .memobox .actions { margin-top:6px; }
  .btn.warn { border-color:#b36b00; color:#b36b00; }
  .btn.warn.primary { background:#b36b00; color:#fff; border-color:#b36b00; }
  .badge.auto { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); font-weight:700; }
  .badge.linked { background:color-mix(in srgb, #2563eb 20%, transparent); color:#1d4ed8; font-weight:700; }
  .btn.info { border-color:#2563eb; color:#2563eb; }
  .btn.info.primary { background:#2563eb; color:#fff; }
  .badge.manual { background:color-mix(in srgb, #d97706 24%, transparent); color:#b45309; font-weight:700; }
  @media (prefers-color-scheme: dark) { .badge.manual { color:#fbbf24; } .badge.linked { color:#93c5fd; } }
  .badge { font-size:12px; color:var(--muted); background:var(--chip); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  /* 오른쪽에서 밀려 나오는 상세 패널 */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; opacity:0; pointer-events:none; transition:opacity .2s; }
  #modal.open { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--card); padding:18px; overflow:auto;
           border-radius:14px 0 0 14px; box-shadow:-8px 0 24px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .25s ease; }
  #modal.open .sheet { transform:none; }
  .ordinfo { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4; overflow-wrap:anywhere; }
  .sheet h2 { font-size:21px; margin:0 0 4px; }
  .sheet .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .order { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; }
  .item { align-items:flex-start; padding:8px 0; }
  .item .pic { width:56px; height:56px; object-fit:cover; border-radius:8px; background:var(--chip); flex:none; }
  .item .info { flex:1; min-width:0; overflow-wrap:anywhere; }
  .item .info .pricing { font-size:15px; font-weight:600; color:var(--muted); margin-top:2px; }
  .item .money { text-align:right; white-space:nowrap; font-size:20px; font-weight:800; }
  .item .money small { display:block; font-size:15px; font-weight:600; color:var(--muted); }
  a.btn { text-decoration:none; display:inline-block; margin-top:6px; font-size:12px; padding:4px 10px; }
  .calc { font-size:12px; line-height:1.6; color:var(--muted); margin:2px 0 6px; }
  .calc b { color:var(--text); }
  .calc .ok { color:var(--accent); font-weight:700; }
  .calc .bad { color:#c0392b; font-weight:700; }
  .ratebig { font-size:28px; font-weight:800; color:var(--rate); line-height:1.25; }
  .ratebig small { font-size:16px; font-weight:700; }
  .ratenum { color:var(--rate); }
  .ratesrc { font-size:12px; color:var(--muted); margin-top:2px; }
  .bigcalc { background:var(--chip); border-radius:10px; padding:10px 12px; margin:8px 0; }
  .bigcalc .l1 { font-size:21px; font-weight:800; }
  .bigcalc .l2 { font-size:24px; font-weight:800; margin-top:2px; }
  .bigcalc .l3 { font-size:17px; font-weight:600; margin-top:4px; }
  .bigcalc .l4 { font-size:13px; color:var(--muted); margin-top:2px; }
  .ratebar { font-size:12px; color:var(--muted); background:color-mix(in srgb, var(--rate) 12%, transparent); border-left:4px solid var(--rate); border-radius:8px; padding:8px 12px; margin-top:8px; }
  .order .head span:last-child { font-size:26px; font-weight:800; }
  .order .head { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .order .meta { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .item { display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3px 0; border-top:1px dashed var(--line); }
  .item .opt { color:var(--muted); font-size:12px; }
  .sheet .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .err { color:#c0392b; font-size:13px; margin-top:8px; }
  #login { max-width:320px; margin:20vh auto; text-align:center; }
  #login input, #login button { width:100%; padding:12px; margin-top:10px; font-size:16px; border-radius:8px; border:1px solid var(--line); }
  #login button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>입금 모니터</h1>
  <input id="tokenInput" type="password" placeholder="접속 토큰" autocomplete="current-password">
  <button id="loginBtn">접속</button>
</div>
<main id="app" hidden>
  <header>
    <h1>실시간 입금 내역</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  </header>

  <div class="sumcap" id="sumCap"></div>
  <div class="summary" id="summary">
    <div class="card"><div class="label">미처리 금액</div><div class="value" id="sumPendingTotal">0원</div></div>
    <div class="card" id="cardDoneTotal"><div class="label">처리완료 금액</div><div class="value" id="sumDoneTotal">0원</div></div>
    <div class="card"><div class="label">입금 건수</div><div class="value" id="sumAllCount">0건</div><div class="subnote" id="sumPendingCount"></div></div>
    <div class="card" id="cardDoneCount"><div class="label">처리완료 건수</div><div class="value" id="sumDoneCount">0건</div><div class="subnote" id="sumDoneSplit"></div></div>
  </div>

  <div class="card filters">
    <div class="chips" id="chips">
      <button class="chip" data-range="today">오늘</button>
      <button class="chip" data-range="yesterday">어제</button>
      <button class="chip" data-range="thisWeek">이번주</button>
      <button class="chip" data-range="lastWeek">저번주</button>
      <button class="chip" data-range="all">전체</button>
    </div>
    <div class="row">
      <select id="datefield" aria-label="일자 기준" hidden>
        <option value="all">전체</option>
        <option value="order">주문일자</option>
        <option value="paid" selected>결제일자</option>
      </select>
      <input type="date" id="from" aria-label="시작일자">
      <span class="sep">~</span>
      <input type="date" id="to" aria-label="종료일자">
      <select id="limit" aria-label="보기 개수">
        <option value="10">10개씩</option>
        <option value="20" selected>20개씩</option>
        <option value="50">50개씩</option>
        <option value="100">100개씩</option>
      </select>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="입금자 검색" aria-label="입금자 검색">
      <button class="btn primary" id="qBtn">검색</button>
    </div>
  </div>

  <div class="err" id="matchErr" hidden></div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:color-mix(in srgb,var(--accent) 45%,transparent)"></i>이름·금액 일치</span>
    <span><i style="background:color-mix(in srgb,#e6a100 55%,transparent)"></i>이름만 일치</span>
    <span><i style="background:color-mix(in srgb,#2d7ff9 50%,transparent)"></i>금액만 일치</span>
    <span><i style="background:color-mix(in srgb,#8b949e 55%,transparent)"></i>다른 상태 주문</span>
    <span><i style="background:color-mix(in srgb,var(--accent) 80%,transparent)"></i>자동처리(이름·금액 일치)</span>
    <span><i style="background:color-mix(in srgb,#d97706 80%,transparent)"></i>수동처리(사유 입력)</span>
    <span><i style="background:color-mix(in srgb,#2563eb 80%,transparent)"></i>기처리 연결(이미 처리된 주문)</span>
  </div>
  <div class="listbar">
    <label><input type="checkbox" id="selAll"> 전체 선택</label>
    <span class="listbarR">
      <label class="doneToggle" id="doneToggle" hidden><input type="checkbox" id="doneOnly"> 처리완료만 보기</label>
      <span id="selCount" class="status"></span> <button class="btn danger" id="hideBtn" disabled>선택 삭제</button>
    </span>
  </div>
  <div class="card list"><ul id="list"></ul></div>
  <div class="pager">
    <button id="prev">이전</button>
    <span id="pageInfo">1 / 1</span>
    <button id="next">다음</button>
  </div>
</main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
// 앱(WebView)이 주소 뒤에 #token=… 을 붙여 열면 로그인 없이 들어온다(해시는 서버로 전송되지 않는다).
try {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) { localStorage.setItem('viewToken', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
} catch {}
let token = localStorage.getItem('viewToken') || '';
const state = { from: '', to: '', q: '', limit: 20, page: 1, range: 'today', datefield: 'paid', done: false };
let es, highlightId = null, reqSeq = 0, shopEnabled = false, adminEnabled = false;
const selected = new Set();
const LEVEL_LABEL = { full: '이름·금액 일치', name: '이름만 일치', amount: '금액만 일치', other: '다른 상태 주문' };
let adminToken = localStorage.getItem('adminToken') || '';

// ---- 날짜 계산 (한국시간 기준 'YYYY-MM-DD') ----
const DAY = 86400000;
const kstNow = () => new Date(Date.now() + 9 * 3600000);
const ymd = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => ymd(new Date(Date.parse(s + 'T00:00:00Z') + n * DAY));
const weekStart = (s) => { const dow = new Date(s + 'T00:00:00Z').getUTCDay(); return addDays(s, -((dow + 6) % 7)); }; // 월요일 시작
function rangeDates(name) {
  const today = ymd(kstNow());
  switch (name) {
    case 'today': return [today, today];
    case 'yesterday': { const y = addDays(today, -1); return [y, y]; }
    case 'thisWeek': { const s = weekStart(today); return [s, addDays(s, 6)]; }
    case 'lastWeek': { const s = addDays(weekStart(today), -7); return [s, addDays(s, 6)]; }
    default: return ['', ''];
  }
}
const RANGE_LABEL = { today: '오늘', yesterday: '어제', thisWeek: '이번주', lastWeek: '저번주', all: '전체' };

// 쇼핑몰 DB의 시각은 한국시간 문자열('YYYY-MM-DD HH:MM:SS') 그대로 보여 준다(브라우저 시간대 변환 없음).
const kstText = (s) => (s ? s.slice(5, 16).replace('-', '.') : '');
function fmtTime(iso) {
  return new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
// 리스트에서 바로 메모(처리 사유)를 보고 고치는 부분.
//  link: 메모가 없을 때만 보이는 '메모' 링크(행 높이를 늘리지 않으려고 왼쪽 블록 안에 둔다)
//  row : 메모가 있거나 입력 중일 때만 보이는, 행 아래 전체 너비 한 줄
function memoParts(d) {
  const row = document.createElement('div'); row.className = 'memo';
  const link = document.createElement('button'); link.className = 'link'; link.textContent = '메모';
  const show = () => {
    row.replaceChildren();
    link.hidden = !!d.memo;
    row.hidden = !d.memo;
    if (!d.memo) return;
    const t = document.createElement('span'); t.className = 'memotext'; t.textContent = '📝 ' + d.memo;
    const b = document.createElement('button'); b.className = 'link'; b.textContent = '수정'; b.onclick = edit;
    row.append(t, b);
  };
  const edit = () => {
    link.hidden = true; row.hidden = false; row.replaceChildren();
    const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 500; inp.value = d.memo || ''; inp.placeholder = '메모 / 처리 사유';
    const save = document.createElement('button'); save.className = 'btn'; save.textContent = '저장';
    const cancel = document.createElement('button'); cancel.className = 'link'; cancel.textContent = '취소'; cancel.onclick = show;
    save.onclick = async () => {
      const r = await adminFetch(`/api/deposits/${d.id}/memo`, { method: 'POST', body: JSON.stringify({ memo: inp.value }) });
      if (!r) return;
      if (!r.ok) { alert((await r.json()).error || '메모 저장 실패'); return; }
      d.memo = (await r.json()).memo; show();
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') show(); };
    row.append(inp, save, cancel); inp.focus();
  };
  link.onclick = edit;
  show();
  return { link, row };
}
function renderRow(d) {
  const li = document.createElement('li');
  li.className = [d.id === highlightId ? 'new' : '', d.order_id ? 'done' : d.match_level ? 'm-' + d.match_level : ''].filter(Boolean).join(' ');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(d.id); cb.dataset.id = d.id;
  cb.onchange = () => { cb.checked ? selected.add(d.id) : selected.delete(d.id); updateToolbar(); };
  const lhs = document.createElement('div'); lhs.className = 'lhs';
  const left = document.createElement('div');
  const who = document.createElement('div'); who.className = 'who'; who.textContent = d.sender || '(입금자 미확인)';
  const when = document.createElement('div'); when.className = 'when'; when.textContent = fmtTime(d.received_at);
  left.append(who, when);
  if (d.order_id) {
    const info = document.createElement('div'); info.className = 'ordinfo';
    const items = (d.order_items || []).map((i) => `${i.name}${i.option ? ` (${i.option})` : ''} ×${i.qty}`).join(' / ');
    info.textContent = `주문 ${d.order_id}${items ? ' · ' + items : ''}`;
    left.append(info);
  }
  const mp = adminEnabled ? memoParts(d) : null;
  if (mp) left.append(mp.link);
  const amt = document.createElement('div'); amt.className = 'amt'; amt.textContent = '+' + won(d.amount);
  const right = document.createElement('div'); right.className = 'right';
  // 오른쪽 끝부터 [뱃지] [금액(고정 너비)] [버튼 칸(고정 너비)] 순서로 정렬해 모든 행의 위치를 맞춘다.
  if (d.order_id) {
    const b = document.createElement('span'); b.className = 'badge'; const kindName = ['auto', 'manual', 'linked'][d.order_manual] || 'auto'; b.classList.add(kindName); b.textContent = { auto: '자동처리 #', manual: '수동처리 #', linked: '기처리 #' }[kindName] + d.order_id; b.title = { auto: '이름·금액이 일치해 바로 처리', manual: '이름·금액이 일치하지 않아 사유를 적고 수동으로 처리', linked: '쇼핑몰에서 이미 처리된 주문과 연결(주문 상태 변경 없음)' }[kindName]; right.append(b);
  } else if (shopEnabled && d.match_level) {
    const m = document.createElement('span'); m.className = 'badge'; m.textContent = LEVEL_LABEL[d.match_level]; right.append(m);
  }
  amt.classList.add('amtcol');
  const slot = document.createElement('div'); slot.className = 'slot';
  if (shopEnabled && !d.order_id) {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = '주문 확인'; b.onclick = () => openMatch(d); slot.append(b);
  }
  right.append(amt);
  if (shopEnabled) right.append(slot);
  lhs.append(cb, left);
  li.append(lhs, right);
  if (mp) li.append(mp.row);
  return li;
}
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.1;
    o.start(); o.stop(c.currentTime + 0.2);
  } catch {}
}

// ---- 조회 ----
function syncControls() {
  $('from').value = state.from; $('to').value = state.to;
  $('limit').value = String(state.limit); $('q').value = state.q; $('datefield').value = state.datefield; $('doneOnly').checked = state.done;
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c.dataset.range === state.range));
}
function sumCaption() {
  const fld = state.datefield === 'order' ? '주문일자 ' : state.datefield === 'all' ? '전체(주문·결제) ' : '';
  const base = fld + (state.range ? RANGE_LABEL[state.range] : (state.from || state.to ? `${state.from || '처음'} ~ ${state.to || '현재'}` : '전체'));
  return base + (state.q ? ` · "${state.q}"` : '') + ' 기준 합계';
}
async function load() {
  const seq = ++reqSeq;
  const p = new URLSearchParams({ limit: state.limit, page: state.page });
  if (state.from) p.set('from', state.from);
  if (state.to) p.set('to', state.to);
  if (state.q) p.set('q', state.q);
  if (state.datefield !== 'paid') p.set('datefield', state.datefield);
  if (state.done) p.set('done', 'only');
  const r = await fetch('/api/deposits?' + p, { headers: { authorization: 'Bearer ' + token } });
  if (r.status === 401) { localStorage.removeItem('viewToken'); return showLogin(); }
  if (!r.ok || seq !== reqSeq) return;
  const data = await r.json();
  shopEnabled = !!data.shop;
  adminEnabled = !!data.admin;
  $('datefield').hidden = !shopEnabled;
  $('doneToggle').hidden = !shopEnabled; // 처리(주문 연결)는 쇼핑몰 연동 시에만 있다
  $('matchErr').hidden = !data.match_error;
  if (data.match_error) $('matchErr').textContent = '주문 매칭 조회 실패: ' + data.match_error;
  $('legend').hidden = !shopEnabled;
  $('login').hidden = true; $('app').hidden = false;
  state.page = Math.min(data.page, data.pages);
  const st = data.stats || { pending: { count: data.count, total: data.total }, done: { count: 0, total: 0 } };
  $('sumCap').textContent = sumCaption();
  $('sumPendingTotal').textContent = won(st.pending.total);
  $('sumDoneTotal').textContent = won(st.done.total);
  $('sumAllCount').textContent = (st.pending.count + st.done.count) + '건';
  $('sumPendingCount').textContent = shopEnabled ? `미처리 ${st.pending.count}건` : '';
  $('sumDoneCount').textContent = st.done.count + '건';
  $('sumDoneSplit').textContent = st.done.count ? `자동 ${st.done.count - (st.done.manual || 0) - (st.done.linked || 0)} · 수동 ${st.done.manual || 0} · 기처리 ${st.done.linked || 0}` : '';
  $('cardDoneTotal').hidden = $('cardDoneCount').hidden = !shopEnabled; // 처리(주문 연결)는 쇼핑몰 연동 시에만 있다
  const list = $('list'); list.replaceChildren();
  if (!data.deposits.length) list.innerHTML = '<div class="empty">조건에 맞는 입금 내역이 없습니다</div>';
  data.deposits.forEach((d) => list.append(renderRow(d)));
  $('pageInfo').textContent = `${data.page} / ${data.pages}`;
  $('prev').disabled = data.page <= 1;
  $('next').disabled = data.page >= data.pages;
  highlightId = null;
  syncControls();
  if (!es) connect();
}
function setRange(name) {
  const [f, t] = rangeDates(name);
  Object.assign(state, { range: name, from: f, to: t, page: 1 });
  load();
}
function connect() {
  es = new EventSource('/events?token=' + encodeURIComponent(token));
  es.onopen = () => { $('dot').classList.add('on'); $('statusText').textContent = '실시간 연결됨'; };
  es.onerror = () => { $('dot').classList.remove('on'); $('statusText').textContent = '재연결 중…'; };
  es.addEventListener('processed', () => { load(); }); // 다른 곳에서 처리되면 목록을 새로 고친다
  es.addEventListener('deposit', (e) => {
    highlightId = JSON.parse(e.data).id;
    beep();
    // '오늘/이번주'처럼 이름 있는 기간은 날짜가 바뀌었을 수 있어 다시 계산한다.
    if (state.range) { const [f, t] = rangeDates(state.range); state.from = f; state.to = t; }
    state.page = 1;
    load();
  });
}

// ---- 선택 삭제(숨김) ----
function updateToolbar() {
  const boxes = [...document.querySelectorAll('#list input[type=checkbox]')];
  $('selCount').textContent = selected.size ? `${selected.size}건 선택` : '';
  $('hideBtn').disabled = !selected.size;
  $('selAll').checked = boxes.length > 0 && boxes.every((b) => b.checked);
}
$('selAll').onchange = () => {
  document.querySelectorAll('#list input[type=checkbox]').forEach((b) => {
    b.checked = $('selAll').checked;
    $('selAll').checked ? selected.add(Number(b.dataset.id)) : selected.delete(Number(b.dataset.id));
  });
  updateToolbar();
};
$('hideBtn').onclick = async () => {
  if (!selected.size) return;
  if (!confirm(`선택한 ${selected.size}건을 목록에서 삭제할까요?\n(DB에는 그대로 남고 화면에서만 숨겨집니다)`)) return;
  const r = await adminFetch('/api/deposits/hide', { method: 'POST', body: JSON.stringify({ ids: [...selected] }) });
  if (!r) return;
  if (!r.ok) { alert((await r.json()).error || '삭제 실패'); return; }
  load();
};

// ---- 주문 확인(관리자) ----
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const closeModal = () => { $('modal').classList.remove('open'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(); };
async function adminFetch(path, opts = {}) {
  const send = (t) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: 'Bearer ' + t } });
  // 로그인한 토큰이 관리자 권한도 가지면 그대로 처리한다. 아닐 때만 한 번 물어본다.
  let r = await send(adminToken || token);
  if (r.status !== 401) return r;
  adminToken = (prompt('관리자 토큰을 입력하세요') || '').trim();
  if (!adminToken) return null;
  r = await send(adminToken);
  if (r.status === 401) { adminToken = ''; localStorage.removeItem('adminToken'); alert('관리자 토큰이 올바르지 않습니다'); return null; }
  localStorage.setItem('adminToken', adminToken);
  return r;
}
async function openMatch(d) {
  const r = await adminFetch(`/api/deposits/${d.id}/matches`);
  if (!r) return;
  const sheet = $('sheet'); sheet.replaceChildren();
  requestAnimationFrame(() => $('modal').classList.add('open'));
  if (!r.ok) { sheet.append(el('h2', '', '조회 실패'), el('div', 'err', (await r.json()).error || r.status), actionsRow()); return; }
  const data = await r.json();
  const rel = data.related || { name: [], amount: [], other: [] };
  sheet.append(el('h2', '', `${d.sender || '(입금자 미확인)'} · ${won(d.amount)}`), el('div', 'sub', '최근 60일 주문 기준'));
  const memoBox = el('div', 'memobox');
  memoBox.append(el('div', 'sec', '메모 / 처리 사유'));
  const memoTa = document.createElement('textarea'); memoTa.maxLength = 500; memoTa.value = data.deposit.memo || '';
  memoTa.placeholder = '이름·금액이 일치하지 않는 주문을 수동 처리할 때는 사유를 꼭 적어 주세요';
  const memoAct = el('div', 'actions'); const memoSave = el('button', 'btn', '메모 저장');
  memoSave.onclick = async () => {
    const mr = await adminFetch(`/api/deposits/${d.id}/memo`, { method: 'POST', body: JSON.stringify({ memo: memoTa.value }) });
    if (!mr) return;
    if (!mr.ok) { alert((await mr.json()).error || '메모 저장 실패'); return; }
    d.memo = (await mr.json()).memo; memoSave.textContent = '저장됨 ✓'; load();
  };
  memoAct.append(memoSave); memoBox.append(memoTa, memoAct); sheet.append(memoBox);

  const usdMode = data.currency === 'USD';
  const rate = usdMode && data.rate ? data.rate.rate : null;
  const usd = (n) => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 3 });
  if (usdMode) {
    const bar = el('div', 'ratebar');
    if (rate) {
      const big = el('div', 'ratebig'); big.append('적용 환율 ', `${rate.toLocaleString('ko-KR')}원`, el('small', '', ' / $1'));
      bar.append(big,
        el('div', 'ratesrc', `출처: ${data.rate.source} · 입금 예정액은 100원 단위 올림`));
    } else {
      bar.append(el('div', '', '환율을 찾지 못해 달러 금액만 표시합니다 (서버 설정 SHOP_USD_KRW 로 지정 가능)'));
    }
    sheet.insertBefore(bar, memoBox);
  }
  const diffText = (krw) => {
    const diff = d.amount - krw;
    const span = el('span', diff === 0 ? 'ok' : Math.abs(diff) <= 100 ? 'ok' : 'bad', diff === 0 ? '일치' : `차액 ${diff > 0 ? '+' : ''}${won(diff)}`);
    return span;
  };

  const section = (title, orders, kind) => {
    if (!orders.length) return;
    sheet.append(el('div', 'sec', `${title} (${orders.length})`));
    for (const o of orders) {
      const card = el('div', 'order');
      const pending = o.od_status === '주문';
      const head = el('div', 'head');
      head.append(el('span', '', `주문 ${o.od_id}`), el('span', '', usdMode ? usd(pending ? o.od_misu : o.od_total) : won(pending ? o.od_misu : o.od_total)));
      card.append(head, el('div', 'meta', `주문자 ${o.od_name} · 입금자 ${o.od_deposit_name || '(없음)'} · ${kstText(o.od_time)} · 상태 ${o.od_status}`));
      if (usdMode && rate) {
        const num1 = (n) => Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
        // 미입금 주문은 미수금, 이미 처리된 주문은 미수금이 0 이므로 실제 입금액으로 환산해 비교한다.
        const baseUsd = pending ? o.od_misu : o.od_receipt_price;
        const baseKrw = pending ? o.od_misu_krw : o.od_receipt_krw;
        const calc = el('div', 'bigcalc');
        const l1 = el('div', 'l1'); l1.append(`${usd(baseUsd)} × `, el('span', 'ratenum', `${rate.toLocaleString('ko-KR')}원`), ` = ${num1(baseUsd * rate)}원`);
        calc.append(l1,
          el('div', 'l2', `→ 100원 단위 올림  ${won(baseKrw)}`));
        const l3 = el('div', 'l3'); l3.append(`입금 ${won(d.amount)} · `, diffText(baseKrw));
        calc.append(l3);
        if (baseUsd > 0) calc.append(el('div', 'l4', `${pending ? '입금액 ÷ 미수금' : '입금액 ÷ 주문의 입금액'} = ${num1(d.amount / baseUsd)}원/$ (역산 환율) · 상품+배송 ${usd(o.od_total)} (≈${won(o.od_total_krw)})`));
        card.append(calc);
      } else if (!usdMode && kind === 'name') {
        card.append(el('div', 'diff', `금액 다름: 주문 미수금 ${won(o.od_misu)} / 상품+배송 ${won(o.od_total)} ↔ 입금 ${won(d.amount)}`));
      }
      if (kind === 'name') card.append(el('div', 'diff', '금액이 일치하지 않습니다 (위 계산 참고)'));
      if (kind === 'amount') card.append(el('div', 'diff', `이름 다름: 주문 ${o.od_deposit_name || o.od_name} ↔ 입금 ${d.sender || '(미확인)'}`));
      if (kind === 'other') card.append(el('div', 'diff', `이미 '${o.od_status}' 상태입니다 (입금액 ${usdMode ? usd(o.od_receipt_price) : won(o.od_receipt_price)})`));
      for (const i of o.items) {
        const row = el('div', 'item');
        if (i.image) {
          const img = document.createElement('img'); img.className = 'pic'; img.src = i.image; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
          img.onerror = () => { img.style.visibility = 'hidden'; };
          row.append(img);
        }
        const info = el('div', 'info');
        info.append(el('div', '', `${i.name} × ${i.qty}`));
        if (i.option) info.append(el('div', 'opt', i.option));
        info.append(el('div', 'pricing', usdMode ? `${usd(i.price)}${i.price_krw != null ? ` (≈${won(i.price_krw)})` : ''} / 개` : `${won(i.price)} / 개`));
        if (i.url) { const a = el('a', 'btn', '상품보기'); a.href = i.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; info.append(a); }
        const money = el('div', 'money', usdMode ? usd(i.subtotal) : won(i.subtotal));
        if (usdMode && i.subtotal_krw != null) money.append(el('small', '', `≈${won(i.subtotal_krw)}`));
        row.append(info, money);
        card.append(row);
      }
      if (o.od_send_cost) {
        const row = el('div', 'item'); const info = el('div', 'info', '배송비');
        const money = el('div', 'money', usdMode ? usd(o.od_send_cost) : won(o.od_send_cost));
        if (usdMode && o.od_send_cost_krw != null) money.append(el('small', '', `≈${won(o.od_send_cost_krw)}`));
        row.append(info, money); card.append(row);
      }
      if (kind === 'full') {
        const act = el('div', 'actions'); const ok = el('button', 'btn primary', '주문완료 (입금 처리)');
        ok.onclick = () => confirmOrder(d, o, ok, card, memoTa, 'auto');
        act.append(ok); card.append(act);
      } else if (kind === 'other') {
        card.append(el('div', 'note', `쇼핑몰에서 이미 '${o.od_status}' 상태인 주문입니다. 주문 상태는 바꾸지 않고, 위 메모에 사유를 적은 뒤 이 입금을 그 주문과 연결해 처리 완료로 표시할 수 있습니다.`));
        const act = el('div', 'actions'); const ok = el('button', 'btn info primary', '입금 처리 (기처리 주문과 연결 · 사유 필수)');
        ok.onclick = () => confirmOrder(d, o, ok, card, memoTa, 'linked');
        act.append(ok); card.append(act);
      } else {
        card.append(el('div', 'note', '이름·금액이 모두 일치하지는 않습니다. 확인 후 위 메모에 사유를 적고 수동으로 처리할 수 있습니다.'));
        const act = el('div', 'actions'); const ok = el('button', 'btn warn primary', '수동 입금 처리 (사유 필수)');
        ok.onclick = () => confirmOrder(d, o, ok, card, memoTa, 'manual');
        act.append(ok); card.append(act);
      }
      sheet.append(card);
    }
  };
  section('이름·금액 일치 — 처리 가능', data.candidates, 'full');
  section('이름만 일치', rel.name, 'name');
  section('금액만 일치', rel.amount, 'amount');
  section('다른 상태의 주문 (이름·금액 일치)', rel.other, 'other');
  if (!data.candidates.length && !rel.name.length && !rel.amount.length && !rel.other.length) sheet.append(el('div', 'empty', '관련된 주문이 없습니다'));
  sheet.append(actionsRow());
}
function actionsRow() {
  const a = el('div', 'actions'); const c = el('button', 'btn', '닫기'); c.onclick = closeModal; a.append(c); return a;
}
async function confirmOrder(d, o, btn, card, memoTa, mode) {
  const memo = memoTa.value.trim();
  if (mode !== 'auto' && !memo) { alert('처리 사유(메모)를 입력해야 합니다.'); memoTa.focus(); return; }
  const money = o.od_misu_krw != null ? `$${o.od_misu} ≈ ${won(o.od_misu_krw)}` : won(o.od_misu);
  const msg = mode === 'linked'
    ? `주문 ${o.od_id} (${o.od_name})는 쇼핑몰에서 이미 '${o.od_status}' 상태입니다.\n주문 상태는 바꾸지 않고, 이 입금(${won(d.amount)}, ${d.sender || '입금자 미확인'})을 그 주문과 연결해 처리 완료로 표시합니다.\n\n사유: ${memo}`
    : mode === 'manual'
      ? `주문 ${o.od_id} (${o.od_name}, 미수금 ${money})은 입금 ${won(d.amount)} / ${d.sender || '입금자 미확인'}와(과) 일치하지 않습니다.\n그래도 입금 처리할까요?\n\n사유: ${memo}`
      : `주문 ${o.od_id} (${o.od_name}, ${money})을 입금 처리할까요?\n쇼핑몰 주문 상태가 '입금'으로 바뀝니다.`;
  if (!confirm(msg)) return;
  btn.disabled = true;
  const r = await adminFetch(`/api/deposits/${d.id}/confirm`, { method: 'POST', body: JSON.stringify({ od_id: o.od_id, memo }) });
  if (!r) { btn.disabled = false; return; }
  if (!r.ok) { btn.disabled = false; card.append(el('div', 'err', (await r.json()).error || '처리 실패')); return; }
  closeModal(); load();
}

// ---- 이벤트 ----
document.querySelectorAll('.chip').forEach((c) => c.onclick = () => setRange(c.dataset.range));
for (const id of ['from', 'to']) {
  $(id).onchange = () => { state[id] = $(id).value; state.range = ''; state.page = 1; load(); };
}
$('datefield').onchange = () => { state.datefield = $('datefield').value; state.page = 1; load(); };
$('limit').onchange = () => { state.limit = Number($('limit').value); state.page = 1; load(); };
const runSearch = () => { state.q = $('q').value.trim(); state.page = 1; load(); };
$('qBtn').onclick = runSearch;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
$('doneOnly').onchange = () => { state.done = $('doneOnly').checked; state.page = 1; load(); };
$('prev').onclick = () => { state.page -= 1; load(); };
$('next').onclick = () => { state.page += 1; load(); };

function showLogin() { $('app').hidden = true; $('login').hidden = false; }
$('loginBtn').onclick = () => { token = $('tokenInput').value.trim(); localStorage.setItem('viewToken', token); setRange('today'); };
$('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
token ? setRange('today') : showLogin();
</script>
