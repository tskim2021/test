name: DepositMonitor
options:
  bundleIdPrefix: com.ameyokovip
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 아래 두 값을 본인 것으로 바꾼다(README 참고)
    DEVELOPMENT_TEAM: "L89UNHMAA6"
    PRODUCT_BUNDLE_IDENTIFIER: com.ameyokovip.depositmonitor
targets:
  DepositMonitor:
    type: application
    platform: iOS
    sources: [DepositMonitor]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: DepositMonitor/DepositMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DepositMonitor/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
